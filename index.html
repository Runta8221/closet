<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="クローゼット">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>クローゼット</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --sub:#6b6a66; --line:#e3e1dc;
  --acc:#2f4a3a; --acc2:#e8efe9; --warn:#a33a2a;
}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y;}
html{-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.top h1{font-size:18px;margin:0;letter-spacing:.04em}
.top .cnt{font-size:12px;color:var(--sub)}
nav{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto}
nav button{flex:1;min-width:60px;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-size:14px;color:var(--sub);cursor:pointer}
nav button.on{background:var(--ink);color:#fff}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.banner{background:#fff4e5;border:1px solid #f0d8b0;color:#7a5410;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lpph img{width:100%;height:100%;object-fit:cover;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.item{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.ph{aspect-ratio:1/1;background:#ecebe7;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .meta{padding:7px 9px}
.item .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .wc{font-size:12px;color:var(--sub)}
.badge0{display:inline-block;background:var(--warn);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:4px}
.btn{white-space:nowrap;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.acc{background:var(--acc)}
.btn.del{background:#fff;color:var(--warn);border:1px solid #e7c3bd}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:6;border-radius:999px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
label.f{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:60px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2);vertical-align:-2px;margin-right:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(88vh - env(safe-area-inset-top));overflow-y:auto;border-radius:16px 16px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom));transition:transform .2s}
.ovx{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 2.2vh);transform:translateX(-50%);background:rgba(255,255,255,.92);color:var(--ink);border:0;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;white-space:nowrap}
.sbar{position:sticky;top:0;z-index:3;background:var(--bg);margin:0 -16px 8px;padding:8px 12px 6px;display:flex;align-items:center;justify-content:space-between;touch-action:none}
.sbar .grip{position:absolute;left:50%;top:6px;width:40px;height:5px;border-radius:3px;background:#cfccc5;transform:translateX(-50%)}
.sbar .x{border:0;background:#e9e7e2;color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;margin-top:6px}
.sheet h2{font-size:17px;margin:0 0 6px}
.photoPick{aspect-ratio:4/3;background:#ecebe7;border:2px dashed #cfccc5;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--sub);cursor:pointer;overflow:hidden;position:relative}
.photoPick img{width:100%;height:100%;object-fit:contain;background:#fff}
.outfit{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.oItem .ph{border-radius:10px}
.oItem .lb{font-size:11px;color:var(--sub);margin-top:4px}
.oItem .nm{font-size:13px;font-weight:600}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:6px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
.tag.ng{background:#f8e8e5;color:var(--warn)}
.muted{color:var(--sub);font-size:13px}
.logE{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.logE .d{font-size:12px;color:var(--sub);width:78px;flex:none}
.logE .th{width:44px;height:44px;border-radius:6px;overflow:hidden;background:#ecebe7;flex:none}
.logE .th img{width:100%;height:100%;object-fit:cover}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--sub)}
.sw-toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:12px}
.sw-toggle:last-child{border-bottom:0}
.sw-toggle small{display:block;color:var(--sub);font-size:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;padding:40px 10px;color:var(--sub)}
.fig{position:relative;width:240px;height:480px;margin:0 auto}
.fig svg{position:absolute;inset:0}
.fig .pc{position:absolute;overflow:hidden;background:#ddd}
.fig .pc img{width:100%;height:100%;object-fit:cover;display:block}
.fig .pc.noimg{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-align:center}
.crop{position:fixed;inset:0;z-index:40;background:#111;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}
.crop .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;padding:14px}
.crop .wrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.crop .wrap img{display:block;max-width:none;max-height:none;pointer-events:none}
.crop .box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none}
.crop .box:after{content:"";position:absolute;inset:0;background:linear-gradient(#fff6,#fff6) 33.3% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 66.6% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 0 33.3%/100% 1px no-repeat,linear-gradient(#fff6,#fff6) 0 66.6%/100% 1px no-repeat;pointer-events:none}
.crop .h{position:absolute;width:26px;height:26px;background:#fff;border-radius:50%;margin:-13px 0 0 -13px;touch-action:none;z-index:2}
.crop .bar{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.crop .bar .chip{background:#222;color:#eee;border-color:#444}
.crop .bar .chip.on{background:#fff;color:#111}
.crop .act{display:flex;gap:10px;margin-top:12px}
.crop .act .btn{flex:1}
.ob{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom))}
.ob .pg{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;width:100%}
.ob .ic{font-size:54px;text-align:center;margin-bottom:10px}
.ob h2{font-size:21px;text-align:center;margin:0 0 12px}
.ob p{font-size:15px;line-height:1.75;margin:0 0 10px}
.step,.ob .step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
.ob .step b{color:var(--acc)}
.ob .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.ob .dots span{width:8px;height:8px;border-radius:50%;background:#d6d3cc}.ob .dots span.on{background:var(--ink)}
.ob .nav{display:flex;gap:10px;max-width:520px;margin:0 auto;width:100%}.ob .nav .btn{flex:1}
.guide{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.guide ol{margin:8px 0 12px;padding-left:20px;line-height:1.9}
.col{position:relative;width:100%;max-width:340px;aspect-ratio:3/4.2;margin:0 auto;background:#fbfaf7;border-radius:14px;overflow:hidden}
.col .c{position:absolute;background:#fff;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.14);overflow:hidden;display:flex;align-items:center;justify-content:center}
.col .c img{width:100%;height:100%;object-fit:cover;display:block}
.col .c .lb{position:absolute;left:5px;bottom:4px;max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.88);font-size:9px;padding:1px 5px;border-radius:4px;color:#444}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top"><h1>クローゼット</h1><span class="row" style="gap:10px;align-items:center"><span class="cnt" id="cnt"></span><button id="helpBtn" class="btn sec" style="padding:4px 11px;font-size:14px;border-radius:999px">？</button></span></div>
  <nav id="nav">
    <button data-v="closet" class="on">手持ち</button>
    <button data-v="suggest">コーデ提案</button>
    <button data-v="log">記録</button>
    <button data-v="want">欲しい</button>
    <button data-v="rules">設定</button>
  </nav>
</header>
<main>
  <div id="banner" class="banner hide"></div>
  <section id="v-closet"></section>
  <section id="v-suggest" class="hide"></section>
  <section id="v-log" class="hide"></section>
  <section id="v-want" class="hide"></section>
  <section id="v-rules" class="hide"></section>
</main>
<button class="btn fab" id="fab">＋ 服を登録</button>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" class="hide">
<input type="file" id="bulkIn" accept="image/*" multiple class="hide">
<input type="file" id="importIn" accept="application/json,.json" class="hide">

<script>
/* ===== 定数 ===== */
const CATS=["トップス","ボトムス","アウター","靴","ベルト","帽子","マフラー・ストール","靴下","バッグ","アクセサリー"];
const LAYERS=["1枚でも着る","重ね着用"];const LAYER_OPTS=["1枚で着る","上に重ねる","下に着る"];const SLEEVES=["半袖","長袖","ノースリーブ"];
const layersOf=t=>t&&Array.isArray(t.layers)&&t.layers.length?t.layers:(t&&t.layer==="重ね着用"?["上に重ねる"]:["1枚で着る","下に着る"]);
const canSolo=t=>layersOf(t).includes("1枚で着る")&&t.sheer!=="あり";
const canOver=t=>layersOf(t).includes("上に重ねる")||t.sheer==="あり";
const canUnder=t=>layersOf(t).includes("下に着る")&&t.sheer!=="あり";const SHEERS=["なし","あり"];
const BELT_TYPES=["レザー","布","メッシュ","その他"];const BELT_W=["細い","普通","太い"];const SOCK_LEN=["くるぶし","クルー","ハイ"];
const COLORS=[["黒","#1a1a1a"],["白","#ffffff"],["グレー","#9a9a9a"],["ネイビー","#1f2a48"],["ベージュ","#d8c6a5"],["ブラウン","#6b4a2f"],["カーキ","#7a7550"],["オリーブ","#5b6236"],["デニム","#4a6688"],["青","#2d5fbf"],["水色","#9cc7e6"],["緑","#2f7a4a"],["赤","#b83228"],["ピンク","#e7a3b5"],["黄","#e6c33d"],["オレンジ","#e07b32"],["紫","#6b4a8a"],["柄・マルチ","linear-gradient(135deg,#e07b32,#2d5fbf,#2f7a4a)"]];
const SEASONS=["春","夏","秋","冬"];
const SILS=["タイト","レギュラー","ゆったり","ワイド"];
const TOP_LEN=["短め","普通","長め"];
const BOT_LEN=["ショート","アンクル","フル"];
const TASTES=["きれいめ","カジュアル","ストリート","モード","アウトドア","アメカジ","古着","ミリタリー・ワーク","トラッド","スポーツ","韓国系","どれでも"];
const tastesOf=i=>i&&i.tastes&&i.tastes.length?i.tastes:(i&&i.taste?[i.taste]:[]);
const DEFAULT_RULES={basic:["黒","白","グレー","ネイビー","ベージュ","デニム"],maxAccent:1,noBothLoose:true,outerLonger:true,tasteMatch:true,preferLowWear:true,beltMatchShoes:false,shortsShowSocks:true,innerHemShow:false,sleeveLayer:true,avoidDays:3,sleepDays:90};
const LOOSE=s=>s==="ゆったり"||s==="ワイド";
const SLIM=s=>s==="タイト"||s==="レギュラー";

/* ===== 状態 ===== */
const S={wants:[],borrowed:[],pref:{},favs:[],ver:0,items:{},rules:{...DEFAULT_RULES},log:[],mode:"local",uid:null,db:null,assets:null,view:"closet",filter:"すべて",sort:"new",
  sug:{locks:[],scene:"指定なし",packDays:3,fig:true,layer:false,hat:false,belt:false,socks:false,scarf:false,mode:"rule",season:curSeason(),outer:["秋","冬"].includes(curSeason()),anchor:"",result:null}};
function curSeason(){const m=new Date().getMonth()+1;return m>=3&&m<=5?"春":m>=6&&m<=8?"夏":m>=9&&m<=11?"秋":"冬";}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800);}
function colorCss(n){const c=COLORS.find(x=>x[0]===n);return c?c[1]:"#ccc";}
const catsOf=i=>i&&i.cats&&i.cats.length?i.cats:(i&&i.cat?[i.cat]:[]);
const inCat=(i,c)=>catsOf(i).includes(c);
const mainsOf=i=>i&&i.colorMains&&i.colorMains.length?i.colorMains:(i&&i.colorMain?[i.colorMain]:[]);
const subsOf=i=>i&&i.colorSubs&&i.colorSubs.length?i.colorSubs:(i&&i.colorSub?[i.colorSub]:[]);
function sw(n){return n?`<span class="sw" style="background:${colorCss(n)}"></span>${esc(n)}`:"";}
const PHOTO_URL={};
function imgSrc(it){if(!it)return "";const cur=S.items[it.id]||it;const u=(cur.photoKey&&PHOTO_URL[cur.photoKey])||(it.photoKey&&PHOTO_URL[it.photoKey]);if(u)return u;
  const m=cur.sample&&/^sample_(\d+)$/.exec(cur.id);return m?"samples/s"+String(m[1]).padStart(2,"0")+".jpg":"";}
function ph(it){const s=imgSrc(it);if(s)return `<img src="${esc(s)}" alt="" loading="lazy">`;if(it&&it.colorMain)return `<div style="width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;background:${colorCss(it.colorMain)}"><span style="background:rgba(255,255,255,.85);color:#555;font-size:11px;padding:2px 6px;border-radius:4px;margin-bottom:6px">写真なし</span></div>`;return "写真なし";}

/* ===== 端末内への保存（IndexedDB） ===== */
let DB=null;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("closet",1);
  r.onupgradeneeded=()=>{const d=r.result;["items","photos","meta"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n);});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=DB.transaction(store,mode);const st=t.objectStore(store);const out=fn(st);
  t.oncomplete=()=>res(out instanceof IDBRequest?out.result:out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const idbPut=(store,key,val)=>tx(store,"readwrite",st=>st.put(val,key));
const idbDel=(store,key)=>tx(store,"readwrite",st=>st.delete(key));
const idbGet=(store,key)=>tx(store,"readonly",st=>st.get(key));
function idbAll(store){return new Promise((res,rej)=>{const t=DB.transaction(store,"readonly");const st=t.objectStore(store);const out={};
  const c=st.openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue();}else res(out);};c.onerror=()=>rej(c.error);});}
function err(){toast("保存に失敗しました");}
async function duplicateItem(it){
  const copyKey=async k=>{if(!k||!PHOTO_URL[k])return null;const b=await (await fetch(PHOTO_URL[k])).blob();return b;};
  const orig=await copyKey(it.origKey)||await copyKey(it.photoKey);
  if(!orig){toast("写真のない服は複製できない");return;}
  openForm(null,{origBlob:orig,autoCrop:true,it:{seasons:it.seasons||[],taste:it.taste}});
  toast("元の写真から、別の服の部分を囲む");}
async function saveItem(it){S.items[it.id]=it;S.ver=(S.ver||0)+1;render();try{await idbPut("items",it.id,it);}catch(e){err();}}
async function deleteItem(id){const it=S.items[id];delete S.items[id];S.ver=(S.ver||0)+1;render();
  try{await idbDel("items",id);for(const k of [it&&it.photoKey,it&&it.origKey]){if(k){await idbDel("photos",k);URL.revokeObjectURL(PHOTO_URL[k]);delete PHOTO_URL[k];}}}catch(e){err();}}
async function saveRules(){render();try{await idbPut("meta","rules",S.rules);}catch(e){err();}}
async function savePref(){try{await idbPut("meta","pref",S.pref);}catch(e){err();}}
async function saveFavs(){try{await idbPut("meta","favs",S.favs);}catch(e){err();}}
async function saveLog(){try{await idbPut("meta","log",S.log.slice(0,300));}catch(e){err();}}
async function savePhoto(blob){const key="p_"+rid();await idbPut("photos",key,blob);PHOTO_URL[key]=URL.createObjectURL(blob);return key;}

async function init(){
  render();
  try{DB=await idbOpen();}catch(e){banner("このブラウザでは保存が使えません。プライベートブラウズを解除して開き直してください。");return;}
  const [items,photos,rules,log,pref,favs,wants,borrowed]=await Promise.all([idbAll("items"),idbAll("photos"),idbGet("meta","rules"),idbGet("meta","log"),idbGet("meta","pref"),idbGet("meta","favs"),idbGet("meta","wants"),idbGet("meta","borrowed")]);
  S.wants=Array.isArray(wants)?wants:[];S.borrowed=Array.isArray(borrowed)?borrowed:[];
  S.pref=(pref&&typeof pref==="object"&&!Array.isArray(pref))?pref:{};S.favs=Array.isArray(favs)?favs:[];
  for(const k in photos)PHOTO_URL[k]=URL.createObjectURL(photos[k]);
  S.items=items||{};for(const id in S.items){if(S.items[id].cat==="小物"){S.items[id].cat="アクセサリー";idbPut("items",id,S.items[id]).catch(()=>{});}}
  S.rules={...DEFAULT_RULES,...(rules||{})};S.log=Array.isArray(log)?log:[];
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
  if(needInstall()){const b=$("#banner");b.innerHTML=`${IN_APP?"続けて使うならSafariで開いて、ホーム画面に追加":"気に入ったらホーム画面に追加するとアプリとして使える"} <u>やり方</u>`;b.dataset.showinstall="1";b.setAttribute("data-showinstall","");b.style.cursor="pointer";b.classList.remove("hide");}

function rgb2lab(r,g,b){[r,g,b]=[r,g,b].map(v=>{v/=255;return v>0.04045?((v+0.055)/1.055)**2.4:v/12.92;});

  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;x=f(x);y=f(y);z=f(z);return [116*y-16,500*(x-y),200*(y-z)];}
const PAL_LAB=COLORS.filter(c=>c[1].startsWith("#")).map(([n,h])=>[n,rgb2lab(parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16))]);
async function detectColor(blob){const u=URL.createObjectURL(blob);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;});
  const N=64;const c=document.createElement("canvas");c.width=N;c.height=N;const x=c.getContext("2d");x.drawImage(img,0,0,N,N);const d=x.getImageData(0,0,N,N).data;
  const px=(i,j)=>{const k=(j*N+i)*4;return [d[k],d[k+1],d[k+2]];};
  // 背景の色（四辺の平均）
  let br=0,bg=0,bb=0,bn=0;for(let i=0;i<N;i++)for(const [a,b2] of [[i,0],[i,N-1],[0,i],[N-1,i]]){const p=px(a,b2);br+=p[0];bg+=p[1];bb+=p[2];bn++;}
  const bgLab=rgb2lab(br/bn,bg/bn,bb/bn);const votes={};
  for(let j=Math.floor(N*.2);j<N*.8;j++)for(let i=Math.floor(N*.2);i<N*.8;i++){const p=px(i,j);const L=rgb2lab(...p);
    const dbg=Math.hypot(L[0]-bgLab[0],L[1]-bgLab[1],L[2]-bgLab[2]);if(dbg<12)continue;
    let best=null,bd=1e9;for(const [n,q] of PAL_LAB){const dd=Math.hypot(L[0]-q[0],L[1]-q[1],L[2]-q[2]);if(dd<bd){bd=dd;best=n;}}votes[best]=(votes[best]||0)+1;}
  const area=(N*.6)**2;let e=Object.entries(votes).sort((a,b)=>b[1]-a[1]);
  if(e.reduce((a,v)=>a+v[1],0)<area*0.1){const v2={};for(let j=Math.floor(N*.3);j<N*.7;j++)for(let i=Math.floor(N*.3);i<N*.7;i++){const L=rgb2lab(...px(i,j));
    let best=null,bd=1e9;for(const [n,q] of PAL_LAB){const dd=Math.hypot(L[0]-q[0],L[1]-q[1],L[2]-q[2]);if(dd<bd){bd=dd;best=n;}}v2[best]=(v2[best]||0)+1;}
    e=Object.entries(v2).sort((a,b)=>b[1]-a[1]);}
  if(!e.length)return null;
  const tot=e.reduce((a,v)=>a+v[1],0);return {main:e[0][0],sub:e[1]&&e[1][1]/tot>0.25?e[1][0]:""};
}catch(e){return null;}finally{URL.revokeObjectURL(u);}}

      <div class="h" data-h="nw"></div><div class="h" data-h="ne"></div><div class="h" data-h="sw"></div><div class="h" data-h="se"></div></div></div>

  document.body.appendChild(ov);

  let W=0,H=0,ratio=0,r={x:0,y:0,w:0,h:0};const MIN=40;

    hs.forEach(h=>{const p=pos[h.dataset.h];h.style.left=p[0]+"px";h.style.top=p[1]+"px";});}
  function fit(){const stEl=ov.querySelector(".stage");const cs=getComputedStyle(stEl);

    if(ratio){if(w/h>ratio)w=h*ratio;else h=w/ratio;}

  img.onload=()=>{fit();setRatio(0);};img.src=url;
  ov.querySelector(".bar").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;ov.querySelectorAll(".bar .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");
    setRatio(c.dataset.r==="all"?"all":Number(c.dataset.r));};
  let drag=null;
  function down(e,mode){e.preventDefault();e.stopPropagation();drag={mode,sx:e.clientX,sy:e.clientY,r0:{...r}};
    (e.target).setPointerCapture&&e.target.setPointerCapture(e.pointerId);}
  box.addEventListener("pointerdown",e=>down(e,"move"));hs.forEach(h=>h.addEventListener("pointerdown",e=>down(e,h.dataset.h)));
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
  function up(){drag=null;}
  function move(e){if(!drag)return;e.preventDefault();const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy,o=drag.r0;let n={...o};
    if(drag.mode==="move"){n.x=Math.min(Math.max(0,o.x+dx),W-o.w);n.y=Math.min(Math.max(0,o.y+dy),H-o.h);r=n;draw();return;}
    const m=drag.mode;let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
    if(m.includes("w"))x1=Math.min(Math.max(0,o.x+dx),x2-MIN);if(m.includes("e"))x2=Math.max(Math.min(W,x2+dx),x1+MIN);
    if(m.includes("n"))y1=Math.min(Math.max(0,o.y+dy),y2-MIN);if(m.includes("s"))y2=Math.max(Math.min(H,y2+dy),y1+MIN);
    if(ratio){let w=x2-x1,h=y2-y1;if(w/h>ratio)w=h*ratio;else h=w/ratio;
      if(m.includes("w"))x1=x2-w;else x2=x1+w;if(m.includes("n"))y1=y2-h;else y2=y1+h;

  function close(v){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
    ov.remove();if(src instanceof Blob)URL.revokeObjectURL(url);resolve(v);}
  ov.querySelector("#cc").onclick=()=>close(null);
  ov.querySelector("#co").onclick=()=>{const k=img.naturalWidth/img.getBoundingClientRect().width;const sx=r.x*k,sy=r.y*k,sw=r.w*k,sh=r.h*k;
    const sc=Math.min(1,1000/Math.max(sw,sh));const c=document.createElement("canvas");c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
    c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);c.toBlob(b=>close(b),"image/jpeg",.85);};
});}

 log:`<h2>記録タブ</h2><div class="guide" style="margin-top:6px"><ol><li><b>あなたの傾向</b>：いいねや着用から分かった好み</li><li><b>着回し力ランキング</b>：手持ちと何通り組めるか</li><li><b>眠っている服・手放し候補</b>：しばらく着ていない服</li><li><b>着用の履歴</b>：「これを着た」の記録</li></ol></div>`,
 rules:`<h2>設定タブ</h2><div class="guide" style="margin-top:6px"><ol><li>ベーシック色と差し色の上限を決める</li><li>組み合わせのルールをオン・オフする</li><li>好みの学習をリセットできる</li><li><b>バックアップ</b>：機種変更の前に「書き出す」で保存しておく</li><li>「使い方をもう一度見る」で最初の案内が出る</li></ol></div>`};
function showHelp(){openSheet(HELP[S.view]+`<div class="row" style="margin-top:14px;justify-content:space-between"><span class="row" style="gap:8px"><a class="btn sec" href="guide.html" style="text-decoration:none">使い方ガイド（全部）</a><button class="btn sec" id="hOb">最初の案内</button></span><button class="btn" id="hClose">閉じる</button></div>`);

/* ===== お試しデータ ===== */
async function loadSamples(){const now=Date.now();
  let list;try{const r=await fetch("samples/samples.json",{cache:"no-cache"});if(!r.ok)throw new Error(r.status);list=await r.json();}
  catch(e){openSheet(`<h2>お試しの服を読み込めなかった</h2><p>お試し用の服のデータ（samples フォルダ）が見つからない。電波を確認するか、公開しているサイトに samples フォルダが入っているかを確認する。</p>`);return false;}
  toast("作った人のクローゼットを読み込み中…");let k=0,miss=0;
  let why="";for(const a of list){let key=null;
    const id="sample_"+(k++);let lw="";if(a.ago!=null){const d=new Date(now-a.ago*86400000);lw=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
    const it={...a,id,sample:true,created:now-400*86400000+k,lastWorn:lw,...(key?{photoKey:key}:{})};delete it.ago;delete it.img;await saveItem(it);}
  render();if(miss)setTimeout(()=>toast(`写真を${miss}枚読み込めなかった：${why}`),1500);return true;}
async function fetchSampleImg(name){let last="";for(let k=0;k<2;k++){try{const r=await fetch("samples/"+name+"?v="+Date.now(),{cache:"reload"});if(!r.ok){last="HTTP "+r.status;continue;}
    const b=await r.blob();if(b.size<500){last="サイズ"+b.size;continue;}return {blob:b.type?b:new Blob([b],{type:"image/jpeg"})};}catch(e){last=String(e&&e.message||e);}}return {err:last};}
async function repairSamples(quiet){const bad=Object.values(S.items).filter(i=>i.sample&&!imgSrc(i));if(!bad.length){render();return 0;}
  let list;try{const r=await fetch("samples/samples.json",{cache:"no-cache"});if(!r.ok)return -1;list=await r.json();}catch(e){return -1;}
  let ok=0,why="";if(!quiet)toast("お試しの写真を読み込み中…");
  for(const it of bad){const a=list[+String(it.id).replace("sample_","")];if(!a||!a.img)continue;
    const f=await fetchSampleImg(a.img);if(f.err){why=f.err;continue;}try{const key=await savePhoto(f.blob);await saveItem({...it,photoKey:key});ok++;}catch(e){why="保存できない（"+(e&&e.message||e)+"）";}}
  if(S.sug.result&&S.sug.result.outfit)for(const c in S.sug.result.outfit){const i=S.sug.result.outfit[c];if(S.items[i.id])S.sug.result.outfit[c]=S.items[i.id];}
  render();if(ok<bad.length)toast(`お試しの写真を${bad.length-ok}枚読み込めなかった：${why}`);else if(!quiet)toast(`お試しの写真を${ok}枚読み込んだ`);return ok;}
async function clearSamples(){for(const it of Object.values(S.items).filter(i=>i.sample))await deleteItem(it.id);
  S.log=S.log.map(l=>({...l,ids:l.ids.filter(id=>!String(id).startsWith("sample_"))})).filter(l=>l.ids.length);await saveLog();
  S.favs=S.favs.filter(f=>!Object.values(f.slots).some(id=>String(id).startsWith("sample_")));await saveFavs();S.sug.result=null;S.sug.pack=null;render();toast("お試しデータを消した");}
function sampleBar(){const n=Object.values(S.items).filter(i=>i.sample).length;if(!n)return "";
  return `<div class="banner" style="background:#eef0f6;border-color:#cfd5e6;color:#2b3a67;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>作った人の服（${n}着）でお試し中</span><button class="btn sec" data-clearsample style="padding:5px 10px;font-size:12px;flex:none">消す</button></div>`;}
document.addEventListener("click",e=>{if(e.target.closest("[data-clearsample]"))clearSamples();if(e.target.closest("[data-fixsample]")){repairSamples(false).then(n=>{if(n===0&&!Object.values(S.items).some(i=>i.sample&&!imgSrc(i)))toast("お試しの写真はすべて入っている");});}if(e.target.closest("[data-loadsample]")){loadSamples().then(ok=>{if(!ok)return;S.view="suggest";S.sug.result=generate();render();toast("作った人の服でコーデを出した。「引き直す」で別の組み合わせになる");});}
  if(e.target.closest("[data-addown]"))guardOwn(addMenu);});

/* ===== 描画 ===== */
function render(){
  const all=Object.values(S.items);
  $("#cnt").textContent=all.length+"着";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  ["closet","suggest","log","want","rules"].forEach(v=>$("#v-"+v).classList.toggle("hide",v!==S.view));
  $("#fab").classList.toggle("hide",S.view!=="closet");
  if(S.view==="closet")renderCloset(all);
  if(S.view==="suggest")renderSuggest(all);
  if(S.view==="log")renderLog(all);
  if(S.view==="rules")renderRules();
  if(S.view==="want")renderWant();
}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.view=b.dataset.v;render();window.scrollTo(0,0);};

function renderCloset(all){
  const f=S.filter;const sleepIds=new Set(sleepingItems(S.rules.sleepDays||90).map(i=>i.id));
  let list=all.filter(it=>f==="すべて"||(f==="未設定"?!it.cat:f==="眠っている"?sleepIds.has(it.id):f==="洗濯中"?it.washing:inCat(it,f)));
  const srt={new:(a,b)=>(b.created||0)-(a.created||0),few:(a,b)=>(a.wear||0)-(b.wear||0),many:(a,b)=>(b.wear||0)-(a.wear||0),
    old:(a,b)=>(a.lastWorn||"").localeCompare(b.lastWorn||"")};
  list.sort(srt[S.sort]);
  const unset=all.filter(i=>!i.cat).length;
  const chips=["すべて",...CATS,...(unset?["未設定"]:[]),...(sleepIds.size?["眠っている"]:[]),...(all.some(i=>i.washing)?["洗濯中"]:[])].map(c=>`<span class="chip ${c===f?"on":""}" data-f="${c}">${c}</span>`).join("");
  const never=all.filter(i=>!i.wear).length;
  $("#v-closet").innerHTML=`
    ${sampleBar()}
    ${!all.length?`<div class="guide"><b>はじめに</b><ol><li>右下の「＋ 服を登録」を押し、取り込み方を選ぶ（文字で打つだけでもよい）</li><li>写真なら、枠で服だけを囲んで切り抜く</li><li>カテゴリなどを選んで保存。まずは<b>トップス・ボトムス・靴</b>を1着ずつ</li><li>「コーデ提案」タブで「コーデを出す」</li></ol>
      <div class="row"><button class="btn acc" data-loadsample style="flex:1">作った人の服で試す</button><button class="btn sec" data-addown style="flex:1">服を登録する</button></div></div>`:""}
    ${sleepIds.size&&f!=="眠っている"?`<div class="banner" id="sleepBanner" style="cursor:pointer">${S.rules.sleepDays||90}日以上着ていない服が${sleepIds.size}着ある。タップで一覧。コーデ提案では優先して出す。</div>`:""}
    ${unset?`<div class="banner" style="background:#eef3ef;border-color:#cfdcd2;color:var(--acc)">カテゴリ未設定の服が${unset}着ある。タップして属性を入れると、コーデ提案に出るようになる。</div>`:""}
    <div class="row">${chips}</div>
    <div class="row" style="margin-top:10px;justify-content:space-between">
      <span class="row" style="gap:6px"><button class="btn sec" id="bulkBtn" style="padding:7px 12px;font-size:13px">まとめて登録</button><button class="btn sec" id="buyBtn" style="padding:7px 12px;font-size:13px">買う前チェック</button><button class="btn sec" id="sizeBtn" style="padding:7px 12px;font-size:13px">サイズ比較</button></span>
      <span class="muted">${list.length}着${never?`・未着用 ${never}着`:""}</span>
      <select id="sortSel" style="width:auto">
        <option value="new">登録が新しい順</option><option value="few">着用回数が少ない順</option>
        <option value="many">着用回数が多い順</option><option value="old">最後に着た日が古い順</option>
      </select>
    </div>
    ${list.length?`<div class="grid">${list.map(it=>`
      <div class="item" data-id="${it.id}"><div class="ph">${ph(it)}</div>
      <div class="meta"><div class="nm">${esc(it.name||it.cat||"未設定")}${!it.cat?'<span class="badge0" style="background:#7a7550">未設定</span>':""}</div>
      <div class="wc">${it.washing?'<span class="badge0" style="background:#4a6688;margin:0 4px 0 0">洗濯中</span>':""}${sw(it.colorMain)} ・ ${it.wear||0}回${!it.wear?'<span class="badge0">未着用</span>':""}</div></div></div>`).join("")}</div>`
    :(all.length?`<div class="empty">このカテゴリの服はまだない</div>`:"")}`;
  $("#sortSel").value=S.sort;
  $("#sortSel").onchange=e=>{S.sort=e.target.value;render();};
  $("#bulkBtn").onclick=bulkAdd;$("#buyBtn").onclick=buyCheck;$("#sizeBtn").onclick=()=>sizeCompare();
  const sb=$("#sleepBanner");if(sb)sb.onclick=()=>{S.filter="眠っている";render();};
  $("#v-closet").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{S.filter=c.dataset.f;render();});
  $("#v-closet").querySelectorAll(".item").forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
}

/* ===== 登録・編集フォーム ===== */
function chipGroup(name,opts,sel,multi){
  return `<div class="row" data-g="${name}" data-multi="${multi?1:0}">${opts.map(o=>{const on=multi?(sel||[]).includes(o):sel===o;
    const lab=name.startsWith("color")?sw(o):esc(o);return `<span class="chip ${on?"on":""}" data-o="${esc(o)}">${lab}</span>`;}).join("")}</div>`;
}
function readGroup(root,name){const g=root.querySelector(`[data-g="${name}"]`);if(!g)return null;
  const on=[...g.querySelectorAll(".chip.on")].map(c=>c.dataset.o);return g.dataset.multi==="1"?on:(on[0]||"");}
function bindChips(root,onChange){root.querySelectorAll("[data-g]").forEach(g=>g.onclick=e=>{const c=e.target.closest(".chip");if(!c)return;
  if(g.dataset.multi==="1")c.classList.toggle("on");else{const was=c.classList.contains("on");if(was&&g.dataset.g!=="colorSub")return;g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));if(!was)c.classList.add("on");}
  onChange&&onChange(g.dataset.g);});}

function openLockPicker(opts){const sg=S.sug;const sel=new Set(sg.locks||[]);
  const cats=["トップス","ボトムス","アウター","靴","ベルト","帽子","マフラー・ストール","靴下"].filter(c=>opts.some(i=>inCat(i,c)));let cur=cats[0];
  const o=openSheet(`<h3 style="margin:4px 0 8px">決まっている服を選ぶ</h3><div class="row" id="lpTabs" style="gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px"></div>
    <div id="lpGrid" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px"></div>
    <div style="position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;margin-top:10px"><button class="btn" id="lpDone" style="width:100%">決定（<span id="lpN">0</span>着）</button></div>`);
  const q=x=>o.querySelector(x);
  const draw=()=>{q("#lpN").textContent=sel.size;
    q("#lpTabs").innerHTML=cats.map(c=>{const n=opts.filter(i=>inCat(i,c)&&sel.has(i.id)).length;return `<span class="chip ${c===cur?"on":""}" data-lpc="${c}" style="flex:none">${c}${n?` ●${n}`:""}</span>`;}).join("");
    q("#lpGrid").innerHTML=opts.filter(i=>inCat(i,cur)).map(i=>{const on=sel.has(i.id);return `<div data-lpi="${i.id}" style="cursor:pointer;position:relative"><div class="ph lpph" style="aspect-ratio:1;width:100%;border-radius:10px;overflow:hidden;outline:${on?"3px solid var(--acc)":"1px solid var(--line)"};outline-offset:-1px">${ph(i)}</div>${on?`<span style="position:absolute;top:4px;right:4px;background:var(--acc);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px">🔒</span>`:""}<div style="font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.name||i.cat)}</div><div class="muted" style="font-size:10px">${i.wear||0}回</div></div>`;}).join("");
    o.querySelectorAll("[data-lpc]").forEach(e=>e.onclick=()=>{cur=e.dataset.lpc;draw();});
    o.querySelectorAll("[data-lpi]").forEach(e=>e.onclick=()=>{const id=e.dataset.lpi;sel.has(id)?sel.delete(id):sel.add(id);draw();});};
  draw();q("#lpDone").onclick=()=>{sg.locks=[...sel];S._shown=[];o.close();render();};}
function openSheet(html){const o=document.createElement("div");o.className="overlay";
  o.innerHTML=`<button class="ovx" data-close>✕ ここをタップで閉じる</button><div class="sheet"><div class="sbar"><span class="grip"></span><button class="x" data-close>← 戻る</button><span></span></div>${html}</div>`;
  const close=()=>{if(!o.isConnected)return;o.remove();o.dispatchEvent(new Event("closed"));};o.close=close;
  o.onclick=e=>{if(e.target===o)close();};o.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  // 上のバーを下にスワイプして閉じる
  const sh=o.querySelector(".sheet"),bar=o.querySelector(".sbar");let y0=null,dy=0;
  bar.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;dy=0;sh.style.transition="none";},{passive:true});
  bar.addEventListener("touchmove",e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`;},{passive:true});
  bar.addEventListener("touchend",()=>{sh.style.transition="";if(dy>90)close();else sh.style.transform="";y0=null;});
  // いちばん上までスクロールした状態から、さらに下に引っぱっても閉じる
  let cy0=null,cdy=0,atTop=false;
  sh.addEventListener("touchstart",e=>{if(e.target.closest(".sbar"))return;atTop=sh.scrollTop<=0;cy0=e.touches[0].clientY;cdy=0;},{passive:true});
  sh.addEventListener("touchmove",e=>{if(cy0===null||!atTop)return;cdy=e.touches[0].clientY-cy0;if(cdy>0&&sh.scrollTop<=0){sh.style.transition="none";sh.style.transform=`translateY(${cdy*0.6}px)`;}},{passive:true});
  sh.addEventListener("touchend",()=>{if(cy0===null)return;sh.style.transition="";if(atTop&&cdy>120)close();else sh.style.transform="";cy0=null;});
  document.body.appendChild(o);return o;}

function openForm(edit,pre){
  const it=edit?{...edit}:{cat:"トップス",seasons:[curSeason()],silhouette:"レギュラー",length:"普通",taste:"カジュアル",colorMain:"",colorSub:""};
  if(pre&&pre.it)Object.assign(it,pre.it);
  let newBlob=pre&&pre.blob||null,origBlob=pre&&pre.origBlob||null;
  let preview=edit?imgSrc(edit):(newBlob?URL.createObjectURL(newBlob):"");
  const hasOrig=()=>!!(origBlob||(it.origKey&&PHOTO_URL[it.origKey]));
  const o=openSheet(`
    <h2>${edit?"服を編集":"服を登録"}</h2>
    <div class="photoPick" id="pp">${preview?`<img src="${esc(preview)}">`:"<div style='font-size:30px'>📷</div><div>タップして写真を撮る・選ぶ</div>"}</div>
    <div class="row" style="margin-top:8px;justify-content:space-between"><span class="muted">写真をタップすると撮り直せる</span><button class="btn sec ${preview||origBlob?"":"hide"}" id="recrop" style="padding:7px 12px;font-size:13px">切り抜き直す</button></div>
    <label class="f">名前（任意）</label><input type="text" id="fName" value="${esc(it.name||"")}" placeholder="例：白のオックスフォードシャツ">
    <label class="f">カテゴリ（複数可）</label>${chipGroup("cat",CATS,catsOf(it),true)}
    <div class="muted" style="margin-top:4px">例：シャツジャケットは「トップス」と「アウター」の両方を選ぶ</div>
    <label class="f">メインの色（複数可） <span id="autoNote" class="muted"></span></label>${chipGroup("colorMain",COLORS.map(c=>c[0]),mainsOf(it),true)}
    <label class="f">サブの色（任意・複数可）</label>${chipGroup("colorSub",COLORS.map(c=>c[0]),subsOf(it),true)}
    <label class="f">季節（複数可）</label>${chipGroup("seasons",SEASONS,it.seasons,true)}
    <div id="extraBox"></div>
    <label class="f">テイスト（複数可）</label>${chipGroup("taste",TASTES,tastesOf(it),true)}
    <label class="f">ブランド（任意）</label><input type="text" id="fBrand" value="${esc(it.brand||"")}">
    <div class="row" style="gap:10px"><div style="flex:1;min-width:130px"><label class="f">購入日（任意）</label><input type="date" id="fDate" value="${esc(it.date||"")}"></div>
    <div style="flex:1;min-width:110px"><label class="f">価格（円・任意）</label><input type="number" id="fPrice" inputmode="numeric" value="${esc(it.price||"")}"></div></div>
    <label class="f">メモ（任意）</label><textarea id="fMemo">${esc(it.memo||"")}</textarea>
    <div class="row" style="margin-top:18px;justify-content:flex-end;flex-wrap:wrap"><button class="btn sec" id="cancel">やめる</button>
      <button class="btn sec ${hasOrig()?"":"hide"}" id="saveNext">保存して同じ写真から次の服へ</button><button class="btn acc" id="save">保存</button></div>`);
  const ex=o.querySelector("#extraBox");
  function lenUI(){const cs=readGroup(o,"cat")||[];const has=c=>cs.includes(c);let h="";
    const f=(lab,g,opts,v)=>`<label class="f">${lab}</label>${chipGroup(g,opts,v)}`;
    if(has("トップス")||has("ボトムス")||has("アウター"))h+=f("シルエット","silhouette",SILS,it.silhouette||"レギュラー");
    if(has("ボトムス"))h+=f("丈（ハーフパンツはショート）","length",BOT_LEN,BOT_LEN.includes(it.length)?it.length:"フル");
    else if(has("トップス")||has("アウター"))h+=f("着丈","length",TOP_LEN,TOP_LEN.includes(it.length)?it.length:"普通");
    if(has("トップス"))h+=f("袖","sleeve",SLEEVES,it.sleeve||"")+`<label class="f">着方（複数可）</label>${chipGroup("layers",LAYER_OPTS,layersOf(it),true)}<div class="muted" style="margin-top:4px">1枚で着る：それだけで着られる／上に重ねる：別の服の上に羽織る・重ねる（半袖シャツを長袖Tの上に、など）／下に着る：インナーにする</div>`;
    if(has("トップス")||has("アウター"))h+=f("透け感（メッシュ・シアーなど）","sheer",SHEERS,it.sheer||"なし");
    if(has("ベルト"))h+=f("種類","beltType",BELT_TYPES,it.beltType||"レザー")+f("太さ","beltWidth",BELT_W,it.beltWidth||"普通");
    if(has("靴下"))h+=f("丈","sockLen",SOCK_LEN,it.sockLen||"クルー");
    const sc=cs.find(c=>SIZE_FIELDS[c]);
    if(sc)h+=f("サイズ感","fit",FITS,it.fit||"")+`<details style="margin-top:10px"${it.size&&Object.keys(it.size).length?" open":""}><summary class="muted">実寸（任意・cm）：通販のサイズ比較に使う</summary>${sizeInputs(sc,it.size)}</details>`;

/* ===== コーデ提案 ===== */
const isBasic=c=>!c||S.rules.basic.includes(c);
function accentColors(items){const set=new Set();items.forEach(i=>{[...mainsOf(i),...subsOf(i)].forEach(c=>{if(c&&!isBasic(c))set.add(c);});});return [...set];}
function lenIdx(l){return TOP_LEN.indexOf(l);}
function daysSince(d){if(!d)return 999;const[y,m,dd]=d.split("-").map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.max(0,Math.round((t-new Date(y,m-1,dd))/86400000));}
function weight(it){if(!S.rules.preferLowWear)return 1;const ds=daysSince(it.lastWorn);return (1/(1+(it.wear||0)))*(1+Math.min(ds,60)/30)*(it.lastWorn&&ds>=(S.rules.sleepDays||90)?2:1);}
function pickWeighted(arr){const w=arr.map(weight);const t=w.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
const pickRand=a=>a[Math.floor(Math.random()*a.length)];

const MAINW=["トップス","インナー","ボトムス","アウター","靴","帽子","マフラー・ストール"];
function checkPair(chosen,cand,slot,ign){const NG=r=>!(ign&&ign.has(r));
  const R=S.rules,all=[...Object.values(chosen),cand];
  if(accentColors(all).length>R.maxAccent)if(NG("差し色が多い"))return "差し色が多い";
  const top=slot==="トップス"?cand:chosen["トップス"],bot=slot==="ボトムス"?cand:chosen["ボトムス"],out=slot==="アウター"?cand:chosen["アウター"];
  if(R.noBothLoose&&top&&bot&&LOOSE(top.silhouette)&&LOOSE(bot.silhouette))if(NG("上下とも太い"))return "上下とも太い";
  if(R.outerLonger&&top&&out&&lenIdx(out.length)>=0&&lenIdx(top.length)>=0&&lenIdx(out.length)<lenIdx(top.length))if(NG("アウターがトップスより短い"))return "アウターがトップスより短い";
  if(R.tasteMatch&&MAINW.includes(slot)){for(const k in chosen){if(!MAINW.includes(k))continue;const c=chosen[k];
    const a=tastesOf(c),b=tastesOf(cand);if(a.length&&b.length&&!a.includes("どれでも")&&!b.includes("どれでも")&&!a.some(x=>b.includes(x)))if(NG("テイストが違う"))return "テイストが違う";}}
  return null;
}
function lineName(o){const t=o["トップス"],b=o["ボトムス"];if(!t||!b)return "";
  if(t.length==="短め"&&LOOSE(b.silhouette))return "Aライン";
  if(LOOSE(t.silhouette)&&SLIM(b.silhouette))return "Yライン";
  if(SLIM(t.silhouette)&&SLIM(b.silhouette))return "Iライン";
  return "";}
const ORDER=["帽子","マフラー・ストール","アウター","トップス","インナー","ベルト","ボトムス","靴下","靴"];
const needsInner=t=>t&&!canSolo(t);

const SCENES=["指定なし","普段・大学","おでかけ","きちんと"];
const SCENE_TASTE={"普段・大学":["カジュアル","ストリート","アウトドア","アメカジ","古着","ミリタリー・ワーク","スポーツ","韓国系","どれでも"],"おでかけ":["きれいめ","モード","カジュアル","トラッド","韓国系","古着","どれでも"],"きちんと":["きれいめ","モード","トラッド","どれでも"]};
function generateCore(sg,opt={}){
  const R=S.rules,rule=sg.mode==="rule",season=sg.season;
  const st=SCENE_TASTE[sg.scene];
  const pool=Object.values(S.items).filter(i=>i.cat&&!i.washing&&(!i.seasons||!i.seasons.length||i.seasons.includes(season))
    &&(!st||!catsOf(i).some(c=>["トップス","ボトムス","アウター","靴"].includes(c))||!tastesOf(i).length||tastesOf(i).some(x=>st.includes(x))));
  const by=c=>pool.filter(i=>inCat(i,c));
  const tops=by("トップス"),inners=tops.filter(canUnder);
  if(!tops.length)return {err:`${season}に着られるトップスが登録されていない`};
  if(!by("ボトムス").length)return {err:`${season}に着られるボトムスが登録されていない`};
  if(sg.layer&&!tops.some(canOver))return {err:"上に重ねられるトップスか透けるトップスが登録されていない。服の編集で「着方」に「上に重ねる」を入れるか、「透け感」を設定する"};
  const shown=opt.noAnchor?[]:(S._shown||[]);
  const pick=a=>{let b=a;for(let n=shown.length;n>0;n--){const ex=new Set(shown.slice(-n).flat());const f=a.filter(x=>!ex.has(x.id));if(f.length){b=f;break;}}return rule?pickWeighted(b):pickRand(b);};
  const fails={};
  const recent=(arr)=>{if(!rule||opt.noRecent||!R.avoidDays)return arr;const a=arr.filter(x=>daysSince(x.lastWorn)>=R.avoidDays);return a.length?a:arr;};
  const fit=(o,slot,arr0)=>{const used=new Set(Object.values(o).map(y=>y.id));const arr=arr0.filter(x=>!used.has(x.id));return !rule?arr:recent(arr.filter(x=>{const r=checkPair(o,x,slot,ign);if(r)fails[r]=(fails[r]||0)+1;return !r;}));};
  const locks=opt.noAnchor?[]:(sg.locks||[]).map(id=>S.items[id]).filter(Boolean);
  const placeLocks=o=>{const lt=locks.filter(i=>inCat(i,"トップス"));
    if(lt.length>=2){const ov=lt.find(x=>canOver(x)&&!canSolo(x))||lt.find(canOver),un=lt.find(x=>x!==ov&&canUnder(x))||lt.find(x=>x!==ov);if(ov&&un){o["トップス"]=ov;o["インナー"]=un;}else{o["トップス"]=lt[0];o["インナー"]=lt[1];}}
    else if(lt.length===1){const x=lt[0];if(!canSolo(x)&&!canOver(x)&&canUnder(x))o["インナー"]=x;else o["トップス"]=x;}
    for(const it of locks){if(Object.values(o).includes(it))continue;
      for(const c of ["ボトムス","アウター","靴","ベルト","帽子","マフラー・ストール","靴下"])if(inCat(it,c)&&!o[c]){o[c]=it;break;}}};
  const ign=new Set();if(rule&&locks.length){const lo={};placeLocks(lo);
    for(const [c,it] of Object.entries(lo)){const rest={...lo};delete rest[c];for(let k=0;k<5;k++){const r=checkPair(rest,it,c,ign);if(!r)break;ign.add(r);}}}
  for(let t=0;t<300;t++){
    const o={},notes=[];let sockMode="",beltMode="";
    placeLocks(o);if(ign.size)notes.push("固定した服どうしが「"+[...ign].join("、")+"」に当たるので、このルールは外して組んだ");
    // メインのトップス
    if(!o["トップス"]){let c=tops.filter(x=>(sg.layer||o["インナー"])?canOver(x):canSolo(x));c=fit(o,"トップス",c);if(!c.length){fails["トップスが合わない"]=(fails["トップスが合わない"]||0)+1;continue;}o["トップス"]=pick(c);}
    const main=o["トップス"];
    if(!o["インナー"]&&((sg.layer&&canOver(main))||!canSolo(main))){
      let c=inners.filter(x=>x.id!==main.id);
      if(rule&&R.innerHemShow)c=c.filter(x=>lenIdx(x.length)>=lenIdx(main.length));
      if(rule&&R.sleeveLayer&&main.sleeve==="半袖"){const lg=c.filter(x=>x.sleeve==="長袖");if(lg.length)c=lg;}
      c=fit(o,"インナー",c);if(!c.length){fails["合うインナーがない"]=(fails["合うインナーがない"]||0)+1;continue;}o["インナー"]=pick(c);}
    if(!o["ボトムス"]){const c=fit(o,"ボトムス",by("ボトムス"));if(!c.length)continue;o["ボトムス"]=pick(c);}
    if(sg.outer&&!o["アウター"]&&by("アウター").length){const c=fit(o,"アウター",by("アウター"));if(c.length)o["アウター"]=pick(c);}
    if(!o["靴"]&&by("靴").length){const c=fit(o,"靴",by("靴"));if(c.length)o["靴"]=pick(c);}
    if(!o["ベルト"]&&sg.belt&&by("ベルト").length){const c=by("ベルト");const ref=o["靴"]?mainsOf(o["靴"]):[];
      const modes=!rule?["どれでも"]:(R.beltMatchShoes?["合わせる"]:(Math.random()<.5?["合わせる","差し色"]:["差し色","合わせる"]));
      for(const m of modes){let cc=m==="どれでも"?c:c.filter(x=>m==="合わせる"?mainsOf(x).some(k=>ref.includes(k)):mainsOf(x).some(k=>!isBasic(k)));cc=fit(o,"ベルト",cc);
        if(!cc.length&&m==="合わせる")cc=fit(o,"ベルト",c.filter(x=>mainsOf(x).every(k=>isBasic(k))));
        if(cc.length){o["ベルト"]=pick(cc);beltMode=m;break;}}
      if(!o["ベルト"])notes.push("合うベルトがない");}
    if(!o["マフラー・ストール"]&&sg.scarf&&by("マフラー・ストール").length){const c=fit(o,"マフラー・ストール",by("マフラー・ストール"));if(c.length)o["マフラー・ストール"]=pick(c);else notes.push("合うマフラー・ストールがない");}
    if(!o["帽子"]&&sg.hat&&by("帽子").length){const c=fit(o,"帽子",by("帽子"));if(c.length)o["帽子"]=pick(c);else notes.push("合う帽子がない");}
    const bl=o["ボトムス"].length;
    if(!o["靴下"]&&sg.socks&&by("靴下").length){
      if(bl==="ショート"||bl==="アンクル"){
        let c=by("靴下");if(bl==="ショート"&&R.shortsShowSocks)c=c.filter(x=>x.sockLen==="クルー"||x.sockLen==="ハイ");
        const ref=[...mainsOf(o["靴"]),...mainsOf(o["ボトムス"])];
        const modes=Math.random()<.5?["合わせる","差し色"]:["差し色","合わせる"];
        for(const m of modes){let cc=c.filter(x=>m==="合わせる"?mainsOf(x).some(k=>ref.includes(k)):mainsOf(x).some(k=>!isBasic(k)));cc=fit(o,"靴下",cc);
          if(!cc.length&&m==="合わせる")cc=fit(o,"靴下",c.filter(x=>mainsOf(x).every(k=>isBasic(k))));
          if(cc.length){o["靴下"]=pick(cc);sockMode=m;break;}}
        if(!o["靴下"])notes.push(bl==="ショート"?"見せられる丈（クルー・ハイ）で合う靴下がない":"合う靴下がない");
      }else notes.push("フル丈なので靴下は見えない");}
    const cats=ORDER.filter(k=>o[k]);
    return {outfit:o,cats,notes,sockMode,beltMode};
  }
  const top=Object.entries(fails).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,2);
  return {err:"ルールに合う組み合わせが見つからなかった"+(top.length?`（主な理由：${top.join("、")}）`:"")+"。ルールを緩めるか、起点の服を変えてみる。"};
}

/* ===== 好みの学習 ===== */
function outfitFeatures(o){const f=[];const t=o["トップス"],b=o["ボトムス"];
  const ln=lineName(o);if(ln)f.push("line:"+ln);
  const ac=accentColors(Object.values(o));if(ac.length)ac.forEach(c=>f.push("accent:"+c));else f.push("accent:なし");
  tastesOf(t).forEach(x=>f.push("taste:"+x));
  if(t&&t.silhouette)f.push("topsil:"+t.silhouette);if(b&&b.silhouette)f.push("botsil:"+b.silhouette);
  if(b&&b.length)f.push("botlen:"+b.length);
  f.push("layer:"+(o["インナー"]?(t.sheer==="あり"?"透け×インナー":"重ね着"):"1枚"));
  return f;}
function prefScore(o){return outfitFeatures(o).reduce((a,k)=>a+(S.pref[k]||0),0);}
async function learn(o,d){outfitFeatures(o).forEach(k=>{S.pref[k]=Math.round(((S.pref[k]||0)+d)*10)/10;});await savePref();}
function generate(){const r=generate0();if(r&&r.outfit){const lk=S.sug.locks||[];S._shown=[...(S._shown||[]),Object.values(r.outfit).map(i=>i.id).filter(id=>!lk.includes(id))].slice(-3);}return r;}
function generate0(){const sg=S.sug;const b=sg.mode==="rule"&&sg.owner&&S.borrowed.find(x=>x.id===sg.owner);
  if(!b)return generateInner();const R0=S.rules,P0=S.pref;S.rules={...DEFAULT_RULES,...b.rules};S.pref=b.pref||{};
  try{const r=generateInner();if(r&&r.outfit)r.notes=[...(r.notes||[]),`${b.name}さんのルールで組んだ`];return r;}finally{S.rules=R0;S.pref=P0;}}
function generateInner(){const sg=S.sug;
  if(sg.mode!=="rule"||!Object.keys(S.pref).length)return generateCore(sg);
  let best=null,bs=-1e9;
  for(let i=0;i<8;i++){const r=generateCore(sg);if(!r.outfit){if(!best)best=r;continue;}const sc=prefScore(r.outfit)+Math.random()*1.2;if(sc>bs){bs=sc;best=r;}}
  return best;}
const PREF_GROUPS=[["line","よく選ぶライン"],["topsil","トップスのシルエット"],["botsil","ボトムスのシルエット"],["botlen","ボトムスの丈"],["accent","差し色"],["taste","テイスト"],["layer","重ね方"]];
function tendencyHTML(){const rows=[];
  for(const [g,lab] of PREF_GROUPS){const ent=Object.entries(S.pref).filter(([k,v])=>k.startsWith(g+":")&&v>0).sort((a,b)=>b[1]-a[1]);
    if(!ent.length)continue;const tot=ent.reduce((a,x)=>a+x[1],0);
    rows.push(`<div class="row" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">${lab}</span><span>${ent.slice(0,2).map(([k,v])=>`${esc(k.split(":")[1])}（${Math.round(v/tot*100)}%）`).join("、")}</span></div>`);}
  const neg=Object.entries(S.pref).filter(([k,v])=>v<0).sort((a,b)=>a[1]-b[1]).slice(0,3);
  if(neg.length)rows.push(`<div class="row" style="justify-content:space-between;padding:5px 0"><span class="muted">あまり選ばない</span><span>${neg.map(([k])=>esc(k.split(":")[1])).join("、")}</span></div>`);
  return rows.length?rows.join(""):`<div class="muted">提案に「いいね／いまいち」を付けたり「これを着た」を押したりすると、ここに好みの傾向が出る。</div>`;}

/* ===== 組み合わせの数え上げ ===== */
function enumCombos(extra){ // extra: 仮の服（買う前チェック用）
  const items=Object.values(S.items).filter(i=>i.cat&&!i.washing);if(extra)items.push(extra);
  const tops=items.filter(i=>inCat(i,"トップス")&&!needsInner(i)),bots=items.filter(i=>inCat(i,"ボトムス")),shoes=items.filter(i=>inCat(i,"靴")),outs=items.filter(i=>inCat(i,"アウター"));
  const shoeList=shoes.length?shoes:[null];const count={};const add=id=>count[id]=(count[id]||0)+1;let total=0;const samples=[];
  for(const t of tops){if(checkPair({},t,"トップス"))continue;
    for(const b of bots){if(b.id===t.id)continue;const o1={"トップス":t};if(checkPair(o1,b,"ボトムス"))continue;
      for(const sh of shoeList){const o2={"トップス":t,"ボトムス":b};if(sh&&checkPair(o2,sh,"靴"))continue;
        total++;add(t.id);add(b.id);if(sh)add(sh.id);const o3={...o2};if(sh)o3["靴"]=sh;
        if(extra&&(o3["トップス"]===extra||o3["ボトムス"]===extra||o3["靴"]===extra))samples.push(o3);
        for(const ou of outs){if(ou.id!==t.id&&ou.id!==b.id&&!checkPair(o3,ou,"アウター")){add(ou.id);if(extra&&ou===extra)samples.push({...o3,"アウター":ou});}}}}}
  return {count,total,samples};}
let COMBO_CACHE=null;
function comboStats(){if(COMBO_CACHE&&COMBO_CACHE.ver===S.ver&&COMBO_CACHE.rules===JSON.stringify(S.rules))return COMBO_CACHE.v;
  const v=enumCombos(null);COMBO_CACHE={ver:S.ver,rules:JSON.stringify(S.rules),v};return v;}
function sleepingItems(days){const now=Date.now();return Object.values(S.items).filter(i=>i.cat&&!["アクセサリー","バッグ"].includes(i.cat)&&
  (i.lastWorn?daysSince(i.lastWorn)>=days:(now-(i.created||now))/86400000>=Math.min(days,30)));}

/* ===== 旅行のパッキング ===== */
function packTrip(days){const sg={...S.sug,mode:"rule",anchor:""};const packed=new Set();const plan=[];const usedTops=new Set();
  for(let d=0;d<days;d++){let best=null,bs=1e9;
    for(let t=0;t<120;t++){const r=generateCore(sg,{noRecent:true,noAnchor:true});if(!r.outfit)continue;
      const ids=Object.values(r.outfit).map(i=>i.id);let sc=ids.filter(id=>!packed.has(id)).length;
      if(usedTops.has(r.outfit["トップス"].id))sc+=0.8;if(sc<bs){bs=sc;best=r;}}
    if(!best)return {err:"組み合わせが作れなかった。季節やルールを見直す"};
    Object.values(best.outfit).forEach(i=>packed.add(i.id));usedTops.add(best.outfit["トップス"].id);plan.push(best.outfit);}
  return {plan,items:[...packed].map(id=>S.items[id])};}

function packHTML(pk){if(pk.err)return `<div style="color:var(--warn);margin-top:10px">${esc(pk.err)}</div>`;
  const th=i=>`<div class="th" title="${esc(i.name||i.cat)}">${imgSrc(i)?`<img src="${esc(imgSrc(i))}">`:""}</div>`;
  const byCat={};pk.items.forEach(i=>(byCat[i.cat]=byCat[i.cat]||[]).push(i));
  return `<div style="margin-top:12px"><b>持っていく服：${pk.items.length}着</b>
    ${ORDER.filter(c=>byCat[c]).map(c=>`<div class="logE"><span class="d">${c}</span>${byCat[c].map(th).join("")}</div>`).join("")}

/* ===== 着画イメージ ===== */
function piece(it,x,y,w,h,clip,z,extra){
  const src=imgSrc(it);const bg=it.colorMain?colorCss(it.colorMain):"#bbb";
  const inner=src?`<img src="${esc(src)}" alt="">`:"";
  return `<div class="pc ${src?"":"noimg"}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;clip-path:${clip};z-index:${z};background:${bg};box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18);${extra||""}">${inner}</div>`;
}
function figureHTML(o){
  const cx=120,top=o["トップス"],inn=o["インナー"],bot=o["ボトムス"],out=o["アウター"],sh=o["靴"],belt=o["ベルト"],hat=o["帽子"],sock=o["靴下"],scarf=o["マフラー・ストール"];
  const waist=200,feet=440;
  let h="";
  const skin="#e2ddd5";
  h+=`<svg viewBox="0 0 240 480" width="240" height="480"><g fill="${skin}">
    <circle cx="120" cy="42" r="24"/><rect x="111" y="62" width="18" height="20" rx="6"/>
    <rect x="44" y="92" width="18" height="190" rx="9"/><rect x="178" y="92" width="18" height="190" rx="9"/>
    <rect x="88" y="200" width="28" height="245" rx="12"/><rect x="124" y="200" width="28" height="245" rx="12"/></g></svg>`;
  const TOPCLIP="polygon(18% 0,82% 0,100% 10%,100% 55%,94% 58%,94% 100%,6% 100%,6% 58%,0 55%,0 10%)";
  const OPEN="polygon(0 8%,16% 0,38% 0,50% 30%,62% 0,84% 0,100% 8%,100% 100%,62% 100%,50% 30%,38% 100%,0 100%)";
  const tw=t=>({"タイト":112,"レギュラー":124,"ゆったり":140,"ワイド":150}[t.silhouette]||124);
  const tl=t=>({"短め":112,"普通":138,"長め":168}[t.length]||138);
  let bw=92;
  if(bot){const wmap={"タイト":78,"レギュラー":92,"ゆったり":108,"ワイド":126};bw=wmap[bot.silhouette]||92;
    const lmap={"ショート":90,"アンクル":215,"フル":238};const L=lmap[bot.length]||238;
    const taper=bot.silhouette==="タイト"?"8%":bot.silhouette==="レギュラー"?"4%":"0%";
    const r=bot.silhouette==="タイト"?"92%":bot.silhouette==="レギュラー"?"96%":"100%";
    h+=piece(bot,cx-bw/2,waist-6,bw,L,`polygon(0 0,100% 0,${r} 100%,53% 100%,50% 16%,47% 100%,${taper} 100%)`,2);}
  if(sock){const sh2={"くるぶし":12,"クルー":46,"ハイ":90}[sock.sockLen]||46;
    h+=piece(sock,90,feet-sh2,24,sh2+4,"inset(0 round 4px)",1);h+=piece(sock,126,feet-sh2,24,sh2+4,"inset(0 round 4px)",1);}
  if(belt){const bh={"細い":6,"普通":9,"太い":12}[belt.beltWidth]||9;h+=piece(belt,cx-bw/2,waist-6,bw,bh,"inset(0)",3);}
  const arms=(g,z,def)=>{const sl=g.sleeve||def;if(!sl||sl==="ノースリーブ")return;const hh=sl==="長袖"?192:52;
    h+=piece(g,42,92,22,hh,"inset(0 round 10px)",z,"opacity:"+(g.sheer==="あり"?.55:1));h+=piece(g,176,92,22,hh,"inset(0 round 10px)",z,"opacity:"+(g.sheer==="あり"?.55:1));};
  if(inn)arms(inn,4,"");if(top)arms(top,5,"");if(out)arms(out,6,"長袖");
  if(inn){h+=piece(inn,cx-tw(inn)/2,86,tw(inn),tl(inn),TOPCLIP,4);}
  if(top){const w=tw(top),L=tl(top);
    if(inn&&top.sheer==="あり")h+=piece(top,cx-w/2,84,w,L,TOPCLIP,5,"opacity:.5");
    else if(inn)h+=piece(top,cx-(w+8)/2,82,w+8,L,OPEN,5);
    else h+=piece(top,cx-w/2,84,w,L,TOPCLIP,5);}
  if(out){const lmap={"短め":130,"普通":175,"長め":250};const L=lmap[out.length]||175;
    const wmap={"タイト":136,"レギュラー":148,"ゆったり":162,"ワイド":172};const w=wmap[out.silhouette]||148;
    h+=piece(out,cx-w/2,80,w,L,"polygon(0 8%,16% 0,40% 0,50% 34%,60% 0,84% 0,100% 8%,100% 100%,61% 100%,50% 34%,39% 100%,0 100%)",6,"box-shadow:0 0 0 1px rgba(0,0,0,.08)"+(out.sheer==="あり"?";opacity:.55":""));}
  if(sh){h+=piece(sh,76,feet-6,44,30,"ellipse(50% 50% at 50% 50%)",7);h+=piece(sh,120,feet-6,44,30,"ellipse(50% 50% at 50% 50%)",7,"transform:scaleX(-1)");}
  if(scarf){h+=piece(scarf,94,66,52,30,"inset(0 round 12px)",8);h+=piece(scarf,124,88,20,70,"inset(0 round 6px)",8);}
  if(hat){h+=piece(hat,88,6,64,34,"ellipse(50% 100% at 50% 100%)",8);}
  return `<div class="fig">${h}</div>`;
}


/* ===== コーデ画像（写真を並べた見本） ===== */
function collageHTML(o){const box=(it,l,t,w,h,z,rot)=>{if(!it)return "";const src=imgSrc(it);const bg=it.colorMain?colorCss(it.colorMain):"#ddd";
    return `<div class="c" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%;z-index:${z};transform:rotate(${rot||0}deg);${src?"":"background:"+bg}">${src?`<img src="${esc(src)}" alt="">`:""}<span class="lb">${esc(it.name||it.cat)}</span></div>`;};
  const out=o["アウター"],top=o["トップス"],inn=o["インナー"],bot=o["ボトムス"],sh=o["靴"];let h="";
  if(out){h+=box(out,4,3,50,40,2,-3);h+=box(top,40,8,46,34,3,2);}else h+=box(top,22,3,56,40,3,0);
  if(inn)h+=box(inn,out?58:62,out?30:24,32,22,4,4);
  h+=box(bot,24,40,52,44,2,0);
  h+=box(sh,60,79,34,19,5,-3);
  h+=box(o["帽子"],2,2,26,16,6,-6);h+=box(o["マフラー・ストール"],70,2,27,17,6,5);
  h+=box(o["ベルト"],2,62,30,12,6,-4);h+=box(o["靴下"],6,80,24,17,5,3);h+=box(o["バッグ"],72,48,26,22,4,6);
  return `<div class="col">${h}</div>`;}

function rankHTML(){const st=comboStats();const its=Object.values(S.items).filter(i=>catsOf(i).some(c=>["トップス","ボトムス","靴","アウター"].includes(c))&&!i.washing&&!needsInner(i));

    ${arr.length>5?`<div class="muted" style="margin-top:10px">組みにくい服</div>${arr.slice(Math.max(5,arr.length-5)).reverse().map(li).join("")}`:""}</div>`;}

    <div class="card"><h3>よく着る服</h3>${most.length?most.map(i=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${esc(i.name||i.cat)}</span><span class="muted">${i.wear}回</span></div>`).join(""):`<div class="muted">まだ記録がない</div>`}</div>
    ${(()=>{const ph2=S.log.filter(l=>l.photoKey&&PHOTO_URL[l.photoKey]).slice(0,30);return ph2.length?`<div class="card"><h3>コーデ日記</h3><div class="outfit">${ph2.map(l=>`<div class="oItem"><div class="ph" style="aspect-ratio:3/4"><img src="${esc(PHOTO_URL[l.photoKey])}"></div><div class="lb">${esc(l.date)}</div></div>`).join("")}</div></div>`:"";})()}
    <div class="card"><h3>着用の履歴</h3>${S.log.length?S.log.slice(0,60).map(l=>`<div class="logE"><span class="d">${esc(l.date)}</span>${l.photoKey&&PHOTO_URL[l.photoKey]?`<div class="th" style="border:2px solid var(--acc)"><img src="${esc(PHOTO_URL[l.photoKey])}"></div>`:""}
      ${l.ids.map(id=>S.items[id]).filter(Boolean).map(i=>`<div class="th">${imgSrc(i)?`<img src="${esc(imgSrc(i))}">`:""}</div>`).join("")}</div>`).join(""):`<div class="muted">「これを着た」を押すとここに残る</div>`}</div>`;
  $("#v-log").querySelectorAll("[data-id]").forEach(e=>e.onclick=()=>openDetail(e.dataset.id));
}

/* ===== ルール ===== */
function renderRules(){
  const R=S.rules;
  const tg=(k,t,s)=>`<div class="sw-toggle"><div>${t}<small>${s}</small></div><input type="checkbox" data-k="${k}" ${R[k]?"checked":""}></div>`;
  $("#v-rules").innerHTML=`
    <div class="card"><h3>ベーシック色</h3><p class="muted" style="margin:0 0 8px">ここで選んだ色は何とでも合う扱いにする。それ以外は差し色として数える。</p>
      ${chipGroup("colorBasic",COLORS.map(c=>c[0]),R.basic,true)}
      <label class="f">1コーデの差し色の上限</label>${chipGroup("maxAccent",["0","1","2","3"],String(R.maxAccent))}</div>
    <div class="card"><h3>組み合わせのルール（ルールモードのみ）</h3>
      ${tg("noBothLoose","上下とも太い組み合わせを避ける","ゆったり・ワイド同士を組ませない")}
      ${tg("outerLonger","アウターの着丈はトップス以上","アウターからトップスがはみ出さない")}
      ${tg("tasteMatch","テイストをそろえる","「どれでも」の服はどれとも合う扱い")}
      ${tg("preferLowWear","着用回数が少ない服を優先する","最近着ていない服ほど出やすくする")}
      ${tg("beltMatchShoes","ベルトは必ず靴と色をそろえる","オフのときは、靴と同色か差し色のどちらかを毎回選ぶ")}
      ${tg("shortsShowSocks","ショート丈のときは靴下を見せる","クルー丈・ハイ丈の靴下だけを選ぶ")}
      ${tg("innerHemShow","レイヤードでインナーの裾を見せる","インナーの着丈を、上に重ねる服以上にする")}
      ${tg("sleeveLayer","半袖を重ねるときは長袖のインナーを合わせる","長袖のインナーがあれば優先して選ぶ")}
      <label class="f">同じ服を続けて出さない日数</label>${chipGroup("avoidDays",["0","1","2","3","5","7"],String(S.rules.avoidDays??3))}
      <label class="f">眠っている服とみなす日数</label>${chipGroup("sleepDays",["30","60","90","180"],String(S.rules.sleepDays||90))}</div>
    <div class="card"><h3>ルールの共有</h3><p class="muted" style="margin:0 0 8px">自分の組み合わせルールと好みをリンクにして友達に渡せる。受け取った人は、あなたの目線で自分の服を組める。服や写真は渡らない。</p>
      <div class="row"><button class="btn sec" id="shareR" style="flex:1">自分のルールを共有する</button><button class="btn sec" id="pasteR" style="flex:1">コードを貼り付ける</button></div>
      ${S.borrowed.length?`<div style="margin-top:10px">${S.borrowed.map(b=>`<div class="row" style="justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(b.name)}さんのルール<span class="muted">（${esc(ruleSummary(b.rules))}）</span></span><button class="btn sec" data-delb="${b.id}" style="padding:5px 10px;font-size:12px">削除</button></div>`).join("")}<p class="muted">コーデ提案で「だれのルールで組むか」から選べる</p></div>`:""}</div>
    <div class="card"><h3>使い方</h3><div class="row"><button class="btn sec" id="obAgain" style="flex:1">使い方をもう一度見る</button><a class="btn sec" href="guide.html" style="flex:1;text-align:center;text-decoration:none">使い方ガイド（全部・PDF保存可）</a>
      ${Object.values(S.items).some(i=>i.sample)?`<button class="btn sec" data-clearsample style="flex:1">お試しデータを消す</button><button class="btn sec" data-fixsample style="flex:1">お試しの写真を読み直す</button>`:`<button class="btn sec" data-loadsample style="flex:1">お試しデータを入れる</button>`}</div></div>
    <div class="card"><h3>好みの学習</h3><p class="muted" style="margin:0 0 8px">「いいね／いまいち」「これを着た」から、好きな組み合わせを覚えて提案に反映している。</p><button class="btn sec" id="resetPref">学習をリセット</button></div>
    <div class="card"><h3>シルエットの名前の付け方</h3><div class="muted">Aライン：トップス短め × ワイド・ゆったりのボトムス<br>Yライン：ゆったりのトップス × タイト・レギュラーのボトムス<br>Iライン：上下ともタイト・レギュラー</div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn sec" id="resetR">初期設定に戻す</button></div>
    <div class="card" style="margin-top:12px"><h3>バックアップ</h3><p class="muted" style="margin:0 0 10px">データはこの端末の中だけにある。機種変更の前や、ときどき書き出してファイルアプリやiCloudに保存しておく。</p>
      <div class="row"><button class="btn sec" id="expB" style="flex:1">書き出す</button><button class="btn sec" id="impB" style="flex:1">読み込む</button></div></div>`;
  const v=$("#v-rules");
  bindChips(v,g=>{if(g==="avoidDays")R.avoidDays=Number(readGroup(v,"avoidDays"));if(g==="sleepDays")R.sleepDays=Number(readGroup(v,"sleepDays"));if(g==="colorBasic")R.basic=readGroup(v,"colorBasic");if(g==="maxAccent")R.maxAccent=Number(readGroup(v,"maxAccent")||1);saveRules();});
  v.querySelectorAll("input[data-k]").forEach(c=>c.onchange=()=>{R[c.dataset.k]=c.checked;saveRules();});
  $("#obAgain").onclick=showOnboarding;$("#shareR").onclick=shareRules;$("#pasteR").onclick=pasteRules;
  v.querySelectorAll("[data-delb]").forEach(b=>b.onclick=async()=>{S.borrowed=S.borrowed.filter(x=>x.id!==b.dataset.delb);if(S.sug.owner===b.dataset.delb)S.sug.owner="";await saveBorrowed();render();});
  $("#resetPref").onclick=async()=>{S.pref={};await savePref();toast("学習をリセットした");render();};
  $("#expB").onclick=exportData;$("#impB").onclick=importData;
  $("#resetR").onclick=()=>{S.rules={...DEFAULT_RULES,basic:[...DEFAULT_RULES.basic]};saveRules();toast("初期設定に戻した");};
}

init();
</script>
</body>
</html>
