<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="クローゼット">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>クローゼット</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --sub:#6b6a66; --line:#e3e1dc;
  --acc:#2f4a3a; --acc2:#e8efe9; --warn:#a33a2a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.top h1{font-size:18px;margin:0;letter-spacing:.04em}
.top .cnt{font-size:12px;color:var(--sub)}
nav{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto}
nav button{flex:1;min-width:72px;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-size:14px;color:var(--sub);cursor:pointer}
nav button.on{background:var(--ink);color:#fff}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.banner{background:#fff4e5;border:1px solid #f0d8b0;color:#7a5410;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.item{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.ph{aspect-ratio:1/1;background:#ecebe7;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .meta{padding:7px 9px}
.item .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .wc{font-size:12px;color:var(--sub)}
.badge0{display:inline-block;background:var(--warn);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:4px}
.btn{white-space:nowrap;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.acc{background:var(--acc)}
.btn.del{background:#fff;color:var(--warn);border:1px solid #e7c3bd}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:6;border-radius:999px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
label.f{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:60px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2);vertical-align:-2px;margin-right:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px 28px}
.sheet h2{font-size:17px;margin:0 0 6px}
.photoPick{aspect-ratio:4/3;background:#ecebe7;border:2px dashed #cfccc5;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--sub);cursor:pointer;overflow:hidden;position:relative}
.photoPick img{width:100%;height:100%;object-fit:contain;background:#fff}
.outfit{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.oItem .ph{border-radius:10px}
.oItem .lb{font-size:11px;color:var(--sub);margin-top:4px}
.oItem .nm{font-size:13px;font-weight:600}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:6px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
.tag.ng{background:#f8e8e5;color:var(--warn)}
.muted{color:var(--sub);font-size:13px}
.logE{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.logE .d{font-size:12px;color:var(--sub);width:78px;flex:none}
.logE .th{width:44px;height:44px;border-radius:6px;overflow:hidden;background:#ecebe7;flex:none}
.logE .th img{width:100%;height:100%;object-fit:cover}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--sub)}
.sw-toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:12px}
.sw-toggle:last-child{border-bottom:0}
.sw-toggle small{display:block;color:var(--sub);font-size:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;padding:40px 10px;color:var(--sub)}
.fig{position:relative;width:240px;height:480px;margin:0 auto}
.fig svg{position:absolute;inset:0}
.fig .pc{position:absolute;overflow:hidden;background:#ddd}
.fig .pc img{width:100%;height:100%;object-fit:cover;display:block}
.fig .pc.noimg{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-align:center}
.crop{position:fixed;inset:0;z-index:40;background:#111;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}
.crop .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;padding:14px}
.crop .wrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.crop .wrap img{display:block;max-width:none;max-height:none;pointer-events:none}
.crop .box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none}
.crop .box:after{content:"";position:absolute;inset:0;background:linear-gradient(#fff6,#fff6) 33.3% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 66.6% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 0 33.3%/100% 1px no-repeat,linear-gradient(#fff6,#fff6) 0 66.6%/100% 1px no-repeat;pointer-events:none}
.crop .h{position:absolute;width:26px;height:26px;background:#fff;border-radius:50%;margin:-13px 0 0 -13px;touch-action:none;z-index:2}
.crop .bar{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.crop .bar .chip{background:#222;color:#eee;border-color:#444}
.crop .bar .chip.on{background:#fff;color:#111}
.crop .act{display:flex;gap:10px;margin-top:12px}
.crop .act .btn{flex:1}
.ob{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom))}
.ob .pg{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;width:100%}
.ob .ic{font-size:54px;text-align:center;margin-bottom:10px}
.ob h2{font-size:21px;text-align:center;margin:0 0 12px}
.ob p{font-size:15px;line-height:1.75;margin:0 0 10px}
.ob .step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
.ob .step b{color:var(--acc)}
.ob .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.ob .dots span{width:8px;height:8px;border-radius:50%;background:#d6d3cc}.ob .dots span.on{background:var(--ink)}
.ob .nav{display:flex;gap:10px;max-width:520px;margin:0 auto;width:100%}.ob .nav .btn{flex:1}
.guide{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.guide ol{margin:8px 0 12px;padding-left:20px;line-height:1.9}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top"><h1>クローゼット</h1><span class="row" style="gap:10px;align-items:center"><span class="cnt" id="cnt"></span><button id="helpBtn" class="btn sec" style="padding:4px 11px;font-size:14px;border-radius:999px">？</button></span></div>
  <nav id="nav">
    <button data-v="closet" class="on">手持ち</button>
    <button data-v="suggest">コーデ提案</button>
    <button data-v="log">記録</button>
    <button data-v="rules">設定</button>
  </nav>
</header>
<main>
  <div id="banner" class="banner hide"></div>
  <section id="v-closet"></section>
  <section id="v-suggest" class="hide"></section>
  <section id="v-log" class="hide"></section>
  <section id="v-rules" class="hide"></section>
</main>
<button class="btn fab" id="fab">＋ 服を登録</button>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" class="hide">
<input type="file" id="bulkIn" accept="image/*" multiple class="hide">
<input type="file" id="importIn" accept="application/json,.json" class="hide">

<script>
/* ===== 定数 ===== */
const CATS=["トップス","ボトムス","アウター","靴","ベルト","帽子","靴下","バッグ","アクセサリー"];
const LAYERS=["1枚でも着る","重ね着用"];const SHEERS=["なし","あり"];
const BELT_TYPES=["レザー","布","メッシュ","その他"];const BELT_W=["細い","普通","太い"];const SOCK_LEN=["くるぶし","クルー","ハイ"];
const COLORS=[["黒","#1a1a1a"],["白","#ffffff"],["グレー","#9a9a9a"],["ネイビー","#1f2a48"],["ベージュ","#d8c6a5"],["ブラウン","#6b4a2f"],["カーキ","#7a7550"],["オリーブ","#5b6236"],["デニム","#4a6688"],["青","#2d5fbf"],["水色","#9cc7e6"],["緑","#2f7a4a"],["赤","#b83228"],["ピンク","#e7a3b5"],["黄","#e6c33d"],["オレンジ","#e07b32"],["紫","#6b4a8a"],["柄・マルチ","linear-gradient(135deg,#e07b32,#2d5fbf,#2f7a4a)"]];
const SEASONS=["春","夏","秋","冬"];
const SILS=["タイト","レギュラー","ゆったり","ワイド"];
const TOP_LEN=["短め","普通","長め"];
const BOT_LEN=["ショート","アンクル","フル"];
const TASTES=["きれいめ","カジュアル","ストリート","モード","アウトドア","どれでも"];
const DEFAULT_RULES={basic:["黒","白","グレー","ネイビー","ベージュ","デニム"],maxAccent:1,noBothLoose:true,outerLonger:true,tasteMatch:true,preferLowWear:true,beltMatchShoes:false,shortsShowSocks:true,innerHemShow:false,avoidDays:3,sleepDays:90};
const LOOSE=s=>s==="ゆったり"||s==="ワイド";
const SLIM=s=>s==="タイト"||s==="レギュラー";

/* ===== 状態 ===== */
const S={pref:{},favs:[],ver:0,items:{},rules:{...DEFAULT_RULES},log:[],mode:"local",uid:null,db:null,assets:null,view:"closet",filter:"すべて",sort:"new",
  sug:{scene:"指定なし",packDays:3,fig:true,layer:false,hat:false,belt:false,socks:false,mode:"rule",season:curSeason(),outer:["秋","冬"].includes(curSeason()),anchor:"",result:null}};
function curSeason(){const m=new Date().getMonth()+1;return m>=3&&m<=5?"春":m>=6&&m<=8?"夏":m>=9&&m<=11?"秋":"冬";}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800);}
function colorCss(n){const c=COLORS.find(x=>x[0]===n);return c?c[1]:"#ccc";}
function sw(n){return n?`<span class="sw" style="background:${colorCss(n)}"></span>${esc(n)}`:"";}
const PHOTO_URL={};
function imgSrc(it){return (it.photoKey&&PHOTO_URL[it.photoKey])||"";}
function ph(it){const s=imgSrc(it);if(s)return `<img src="${esc(s)}" alt="" loading="lazy">`;if(it&&it.colorMain)return `<div style="width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;background:${colorCss(it.colorMain)}"><span style="background:rgba(255,255,255,.85);color:#555;font-size:11px;padding:2px 6px;border-radius:4px;margin-bottom:6px">写真なし</span></div>`;return "写真なし";}

/* ===== 端末内への保存（IndexedDB） ===== */
let DB=null;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("closet",1);
  r.onupgradeneeded=()=>{const d=r.result;["items","photos","meta"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n);});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=DB.transaction(store,mode);const st=t.objectStore(store);const out=fn(st);
  t.oncomplete=()=>res(out instanceof IDBRequest?out.result:out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const idbPut=(store,key,val)=>tx(store,"readwrite",st=>st.put(val,key));
const idbDel=(store,key)=>tx(store,"readwrite",st=>st.delete(key));
const idbGet=(store,key)=>tx(store,"readonly",st=>st.get(key));
function idbAll(store){return new Promise((res,rej)=>{const t=DB.transaction(store,"readonly");const st=t.objectStore(store);const out={};
  const c=st.openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue();}else res(out);};c.onerror=()=>rej(c.error);});}
function err(){toast("保存に失敗しました");}
async function saveItem(it){S.items[it.id]=it;S.ver=(S.ver||0)+1;render();try{await idbPut("items",it.id,it);}catch(e){err();}}
async function deleteItem(id){const it=S.items[id];delete S.items[id];S.ver=(S.ver||0)+1;render();
  try{await idbDel("items",id);if(it&&it.photoKey){await idbDel("photos",it.photoKey);URL.revokeObjectURL(PHOTO_URL[it.photoKey]);delete PHOTO_URL[it.photoKey];}}catch(e){err();}}
async function saveRules(){render();try{await idbPut("meta","rules",S.rules);}catch(e){err();}}
async function savePref(){try{await idbPut("meta","pref",S.pref);}catch(e){err();}}
async function saveFavs(){try{await idbPut("meta","favs",S.favs);}catch(e){err();}}
async function saveLog(){try{await idbPut("meta","log",S.log.slice(0,300));}catch(e){err();}}
async function savePhoto(blob){const key="p_"+rid();await idbPut("photos",key,blob);PHOTO_URL[key]=URL.createObjectURL(blob);return key;}

async function init(){
  render();
  try{DB=await idbOpen();}catch(e){banner("このブラウザでは保存が使えません。プライベートブラウズを解除して開き直してください。");return;}
  const [items,photos,rules,log,pref,favs]=await Promise.all([idbAll("items"),idbAll("photos"),idbGet("meta","rules"),idbGet("meta","log"),idbGet("meta","pref"),idbGet("meta","favs")]);
  S.pref=(pref&&typeof pref==="object"&&!Array.isArray(pref))?pref:{};S.favs=Array.isArray(favs)?favs:[];
  for(const k in photos)PHOTO_URL[k]=URL.createObjectURL(photos[k]);
  S.items=items||{};for(const id in S.items){if(S.items[id].cat==="小物"){S.items[id].cat="アクセサリー";idbPut("items",id,S.items[id]).catch(()=>{});}}
  S.rules={...DEFAULT_RULES,...(rules||{})};S.log=Array.isArray(log)?log:[];
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(!standalone&&/iPhone|iPad|iPod/.test(navigator.userAgent))banner("Safariの共有ボタン（□に↑）→「ホーム画面に追加」でアプリとして使える。データはこの端末の中だけに保存される。");
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
  let seen=false;try{seen=localStorage.getItem("closet-ob")==="1";}catch(e){}
  if(!seen){try{seen=!!(await idbGet("meta","ob"));}catch(e){}}
  if(!seen&&!Object.keys(S.items).length)showOnboarding();
}
function banner(t){const b=$("#banner");b.textContent=t;b.classList.remove("hide");}

/* ===== 画像の縮小 ===== */
function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",q);};
  img.onerror=()=>{URL.revokeObjectURL(u);rej();};img.src=u;});}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});


/* ===== 色の自動判別 ===== */
function rgb2lab(r,g,b){[r,g,b]=[r,g,b].map(v=>{v/=255;return v>0.04045?((v+0.055)/1.055)**2.4:v/12.92;});
  let x=(r*0.4124+g*0.3576+b*0.1805)/0.95047,y=r*0.2126+g*0.7152+b*0.0722,z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;x=f(x);y=f(y);z=f(z);return [116*y-16,500*(x-y),200*(y-z)];}
const PAL_LAB=COLORS.filter(c=>c[1].startsWith("#")).map(([n,h])=>[n,rgb2lab(parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16))]);
async function detectColor(blob){const u=URL.createObjectURL(blob);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;});
  const N=64;const c=document.createElement("canvas");c.width=N;c.height=N;const x=c.getContext("2d");x.drawImage(img,0,0,N,N);const d=x.getImageData(0,0,N,N).data;
  const px=(i,j)=>{const k=(j*N+i)*4;return [d[k],d[k+1],d[k+2]];};
  // 背景の色（四辺の平均）
  let br=0,bg=0,bb=0,bn=0;for(let i=0;i<N;i++)for(const [a,b2] of [[i,0],[i,N-1],[0,i],[N-1,i]]){const p=px(a,b2);br+=p[0];bg+=p[1];bb+=p[2];bn++;}
  const bgLab=rgb2lab(br/bn,bg/bn,bb/bn);const votes={};
  for(let j=Math.floor(N*.2);j<N*.8;j++)for(let i=Math.floor(N*.2);i<N*.8;i++){const p=px(i,j);const L=rgb2lab(...p);
    const dbg=Math.hypot(L[0]-bgLab[0],L[1]-bgLab[1],L[2]-bgLab[2]);if(dbg<12)continue;
    let best=null,bd=1e9;for(const [n,q] of PAL_LAB){const dd=Math.hypot(L[0]-q[0],L[1]-q[1],L[2]-q[2]);if(dd<bd){bd=dd;best=n;}}votes[best]=(votes[best]||0)+1;}
  const area=(N*.6)**2;let e=Object.entries(votes).sort((a,b)=>b[1]-a[1]);
  if(e.reduce((a,v)=>a+v[1],0)<area*0.1){const v2={};for(let j=Math.floor(N*.3);j<N*.7;j++)for(let i=Math.floor(N*.3);i<N*.7;i++){const L=rgb2lab(...px(i,j));
    let best=null,bd=1e9;for(const [n,q] of PAL_LAB){const dd=Math.hypot(L[0]-q[0],L[1]-q[1],L[2]-q[2]);if(dd<bd){bd=dd;best=n;}}v2[best]=(v2[best]||0)+1;}
    e=Object.entries(v2).sort((a,b)=>b[1]-a[1]);}
  if(!e.length)return null;

function cropImage(src){return new Promise(resolve=>{

  ov.innerHTML=`<div style="color:#fff;text-align:center;font-size:14px;margin-bottom:8px">枠を動かして、服の部分だけを囲む</div>
    <div class="stage"><div class="wrap"><img alt=""><div class="box"></div>
      <div class="h" data-h="nw"></div><div class="h" data-h="ne"></div><div class="h" data-h="sw"></div><div class="h" data-h="se"></div></div></div>
    <div class="bar"><span class="chip on" data-r="0">自由</span><span class="chip" data-r="1">正方形</span><span class="chip" data-r="0.75">縦長 3:4</span><span class="chip" data-r="all">全体</span></div>
    <div class="act"><button class="btn sec" id="cc">やめる</button><button class="btn acc" id="co">切り抜く</button></div>`;
  document.body.appendChild(ov);
  const img=ov.querySelector("img"),wrap=ov.querySelector(".wrap"),box=ov.querySelector(".box"),hs=[...ov.querySelectorAll(".h")];
  let W=0,H=0,ratio=0,r={x:0,y:0,w:0,h:0};const MIN=40;
  function draw(){box.style.left=r.x+"px";box.style.top=r.y+"px";box.style.width=r.w+"px";box.style.height=r.h+"px";
    const pos={nw:[r.x,r.y],ne:[r.x+r.w,r.y],sw:[r.x,r.y+r.h],se:[r.x+r.w,r.y+r.h]};
    hs.forEach(h=>{const p=pos[h.dataset.h];h.style.left=p[0]+"px";h.style.top=p[1]+"px";});}
  function fit(){const stEl=ov.querySelector(".stage");const cs=getComputedStyle(stEl);
    const aw=stEl.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=stEl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    const sc=Math.min(aw/img.naturalWidth,ah/img.naturalHeight);
    img.style.width=Math.floor(img.naturalWidth*sc)+"px";img.style.height=Math.floor(img.naturalHeight*sc)+"px";
    W=img.clientWidth;H=img.clientHeight;}
  function setRatio(v){ratio=v;let w=W*0.8,h=H*0.8;
    if(v==="all"){ratio=0;r={x:0,y:0,w:W,h:H};draw();return;}
    if(ratio){if(w/h>ratio)w=h*ratio;else h=w/ratio;}
    r={x:(W-w)/2,y:(H-h)/2,w,h};draw();}
  img.onload=()=>{fit();setRatio(0);};img.src=url;
  ov.querySelector(".bar").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;ov.querySelectorAll(".bar .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");
    setRatio(c.dataset.r==="all"?"all":Number(c.dataset.r));};
  let drag=null;
  function down(e,mode){e.preventDefault();e.stopPropagation();drag={mode,sx:e.clientX,sy:e.clientY,r0:{...r}};
    (e.target).setPointerCapture&&e.target.setPointerCapture(e.pointerId);}
  box.addEventListener("pointerdown",e=>down(e,"move"));hs.forEach(h=>h.addEventListener("pointerdown",e=>down(e,h.dataset.h)));
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
  function up(){drag=null;}
  function move(e){if(!drag)return;e.preventDefault();const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy,o=drag.r0;let n={...o};
    if(drag.mode==="move"){n.x=Math.min(Math.max(0,o.x+dx),W-o.w);n.y=Math.min(Math.max(0,o.y+dy),H-o.h);r=n;draw();return;}
    const m=drag.mode;let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
    if(m.includes("w"))x1=Math.min(Math.max(0,o.x+dx),x2-MIN);if(m.includes("e"))x2=Math.max(Math.min(W,x2+dx),x1+MIN);
    if(m.includes("n"))y1=Math.min(Math.max(0,o.y+dy),y2-MIN);if(m.includes("s"))y2=Math.max(Math.min(H,y2+dy),y1+MIN);
    if(ratio){let w=x2-x1,h=y2-y1;if(w/h>ratio)w=h*ratio;else h=w/ratio;
      if(m.includes("w"))x1=x2-w;else x2=x1+w;if(m.includes("n"))y1=y2-h;else y2=y1+h;
      if(x1<0||y1<0||x2>W||y2>H)return;}

  function close(v){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
    ov.remove();if(src instanceof Blob)URL.revokeObjectURL(url);resolve(v);}
  ov.querySelector("#cc").onclick=()=>close(null);
  ov.querySelector("#co").onclick=()=>{const k=img.naturalWidth/img.getBoundingClientRect().width;const sx=r.x*k,sy=r.y*k,sw=r.w*k,sh=r.h*k;
    const sc=Math.min(1,1000/Math.max(sw,sh));const c=document.createElement("canvas");c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
    c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);c.toBlob(b=>close(b),"image/jpeg",.85);};
});}

/* ===== 登録・編集フォーム ===== */
function chipGroup(name,opts,sel,multi){
  return `<div class="row" data-g="${name}" data-multi="${multi?1:0}">${opts.map(o=>{const on=multi?(sel||[]).includes(o):sel===o;
    const lab=name.startsWith("color")?sw(o):esc(o);return `<span class="chip ${on?"on":""}" data-o="${esc(o)}">${lab}</span>`;}).join("")}</div>`;
}
function readGroup(root,name){const g=root.querySelector(`[data-g="${name}"]`);if(!g)return null;
  const on=[...g.querySelectorAll(".chip.on")].map(c=>c.dataset.o);return g.dataset.multi==="1"?on:(on[0]||"");}
function bindChips(root,onChange){root.querySelectorAll("[data-g]").forEach(g=>g.onclick=e=>{const c=e.target.closest(".chip");if(!c)return;
  if(g.dataset.multi==="1")c.classList.toggle("on");else{const was=c.classList.contains("on");if(was&&g.dataset.g!=="colorSub")return;g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));if(!was)c.classList.add("on");}
  onChange&&onChange(g.dataset.g);});}

function openSheet(html){const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="sheet">${html}</div>`;
  o.onclick=e=>{if(e.target===o)o.remove();};document.body.appendChild(o);return o;}

function askCat(blob,title){return new Promise(res=>{const u=URL.createObjectURL(blob);

async function outfitShot(){const base=await pickPhoto();if(!base)return;

const TXT_COL=[["白","白"],["ホワイト","白"],["黒","黒"],["ブラック","黒"],["グレー","グレー"],["灰","グレー"],["ネイビー","ネイビー"],["紺","ネイビー"],["ベージュ","ベージュ"],["茶","ブラウン"],["ブラウン","ブラウン"],["カーキ","カーキ"],["オリーブ","オリーブ"],["デニム","デニム"],["ジーンズ","デニム"],["水色","水色"],["サックス","水色"],["青","青"],["ブルー","青"],["緑","緑"],["グリーン","緑"],["赤","赤"],["レッド","赤"],["ピンク","ピンク"],["黄","黄"],["イエロー","黄"],["オレンジ","オレンジ"],["紫","紫"],["パープル","紫"],["柄","柄・マルチ"],["チェック","柄・マルチ"],["ボーダー","柄・マルチ"]];
const TXT_CAT=[["ニット帽","帽子"],["キャップ","帽子"],["ハット","帽子"],["バケハ","帽子"],["帽子","帽子"],["ソックス","靴下"],["靴下","靴下"],["ベルト","ベルト"],["スニーカー","靴"],["ローファー","靴"],["ブーツ","靴"],["サンダル","靴"],["革靴","靴"],["シューズ","靴"],["靴","靴"],
  ["コート","アウター"],["ジャケット","アウター"],["ブルゾン","アウター"],["ダウン","アウター"],["マウンテンパーカー","アウター"],["アウター","アウター"],
  ["ハーフパンツ","ボトムス"],["ショーツ","ボトムス"],["短パン","ボトムス"],["スラックス","ボトムス"],["ジーンズ","ボトムス"],["デニム","ボトムス"],["チノ","ボトムス"],["パンツ","ボトムス"],["スカート","ボトムス"],["ズボン","ボトムス"],
  ["カーディガン","トップス"],["ベスト","トップス"],["シャツ","トップス"],["Tシャツ","トップス"],["ロンT","トップス"],["T","トップス"],["ニット","トップス"],["セーター","トップス"],["スウェット","トップス"],["パーカー","トップス"],["タンクトップ","トップス"],["ポロ","トップス"],
  ["バッグ","バッグ"],["トート","バッグ"],["リュック","バッグ"],["ネックレス","アクセサリー"],["リング","アクセサリー"],["指輪","アクセサリー"],["時計","アクセサリー"],["ブレスレット","アクセサリー"]];
function parseItem(t){const w=t.trim();if(!w)return null;const it={name:w,cat:"",colorMain:"",silhouette:"",length:"",layer:"",sheer:""};
  for(const [k,c] of TXT_CAT)if(w.includes(k)){it.cat=c;break;}
  if(/^T$|Tシャツ|ロンT/.test(w)||/[^A-Za-z]T$/.test(w))it.cat="トップス";
  for(const [k,c] of TXT_COL)if(w.includes(k)&&!(k==="デニム"&&it.cat!=="ボトムス"&&!w.startsWith("デニム"))){it.colorMain=c;break;}
  if(/ワイド/.test(w))it.silhouette="ワイド";else if(/ビッグ|オーバー|ゆったり/.test(w))it.silhouette="ゆったり";else if(/スキニー|スリム|タイト/.test(w))it.silhouette="タイト";
  if(/ハーフ|ショーツ|短パン/.test(w))it.length="ショート";else if(/アンクル|クロップド/.test(w))it.length="アンクル";

/* ===== コーデ提案 ===== */
const isBasic=c=>!c||S.rules.basic.includes(c);
function accentColors(items){const set=new Set();items.forEach(i=>{[i.colorMain,i.colorSub].forEach(c=>{if(c&&!isBasic(c))set.add(c);});});return [...set];}
function lenIdx(l){return TOP_LEN.indexOf(l);}
function daysSince(d){if(!d)return 999;const[y,m,dd]=d.split("-").map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.max(0,Math.round((t-new Date(y,m-1,dd))/86400000));}
function weight(it){if(!S.rules.preferLowWear)return 1;const ds=daysSince(it.lastWorn);return (1/(1+(it.wear||0)))*(1+Math.min(ds,60)/30)*(it.lastWorn&&ds>=(S.rules.sleepDays||90)?2:1);}
function pickWeighted(arr){const w=arr.map(weight);const t=w.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
const pickRand=a=>a[Math.floor(Math.random()*a.length)];

const MAINW=["トップス","インナー","ボトムス","アウター","靴","帽子"];
function checkPair(chosen,cand,slot){
  const R=S.rules,all=[...Object.values(chosen),cand];
  if(accentColors(all).length>R.maxAccent)return "差し色が多い";
  const top=slot==="トップス"?cand:chosen["トップス"],bot=slot==="ボトムス"?cand:chosen["ボトムス"],out=slot==="アウター"?cand:chosen["アウター"];
  if(R.noBothLoose&&top&&bot&&LOOSE(top.silhouette)&&LOOSE(bot.silhouette))return "上下とも太い";
  if(R.outerLonger&&top&&out&&lenIdx(out.length)>=0&&lenIdx(top.length)>=0&&lenIdx(out.length)<lenIdx(top.length))return "アウターがトップスより短い";
  if(R.tasteMatch&&MAINW.includes(slot)){for(const k in chosen){if(!MAINW.includes(k))continue;const c=chosen[k];
    if(c.taste&&cand.taste&&c.taste!=="どれでも"&&cand.taste!=="どれでも"&&c.taste!==cand.taste)return "テイストが違う";}}
  return null;
}
function lineName(o){const t=o["トップス"],b=o["ボトムス"];if(!t||!b)return "";
  if(t.length==="短め"&&LOOSE(b.silhouette))return "Aライン";
  if(LOOSE(t.silhouette)&&SLIM(b.silhouette))return "Yライン";
  if(SLIM(t.silhouette)&&SLIM(b.silhouette))return "Iライン";
  return "";}
const ORDER=["帽子","アウター","トップス","インナー","ベルト","ボトムス","靴下","靴"];
const needsInner=t=>t&&(t.layer==="重ね着用"||t.sheer==="あり");

const SCENES=["指定なし","普段・大学","おでかけ","きちんと"];
const SCENE_TASTE={"普段・大学":["カジュアル","ストリート","アウトドア","どれでも"],"おでかけ":["きれいめ","モード","カジュアル","どれでも"],"きちんと":["きれいめ","モード","どれでも"]};
function generateCore(sg,opt={}){
  const R=S.rules,rule=sg.mode==="rule",season=sg.season;
  const st=SCENE_TASTE[sg.scene];
  const pool=Object.values(S.items).filter(i=>i.cat&&!i.washing&&(!i.seasons||!i.seasons.length||i.seasons.includes(season))
    &&(!st||!["トップス","ボトムス","アウター","靴"].includes(i.cat)||!i.taste||st.includes(i.taste)));
  const by=c=>pool.filter(i=>i.cat===c);
  const tops=by("トップス"),inners=tops.filter(t=>!needsInner(t));
  if(!tops.length)return {err:`${season}に着られるトップスが登録されていない`};
  if(!by("ボトムス").length)return {err:`${season}に着られるボトムスが登録されていない`};
  if(sg.layer&&!tops.some(needsInner))return {err:"重ね着用か透けるトップスが登録されていない。服の編集で「重ね方」か「透け感」を設定する"};
  const pick=a=>rule?pickWeighted(a):pickRand(a);
  const fails={};
  const recent=(arr)=>{if(!rule||opt.noRecent||!R.avoidDays)return arr;const a=arr.filter(x=>daysSince(x.lastWorn)>=R.avoidDays);return a.length?a:arr;};
  const fit=(o,slot,arr)=>!rule?arr:recent(arr.filter(x=>{const r=checkPair(o,x,slot);if(r)fails[r]=(fails[r]||0)+1;return !r;}));
  const anchor=rule&&sg.anchor&&!opt.noAnchor?S.items[sg.anchor]:null;
  for(let t=0;t<300;t++){
    const o={},notes=[];let sockMode="",beltMode="";
    if(anchor)o[anchor.cat]=anchor;
    // メインのトップス
    if(!o["トップス"]){let c=tops.filter(x=>sg.layer?needsInner(x):x.layer!=="重ね着用");c=fit(o,"トップス",c);if(!c.length){fails["トップスが合わない"]=(fails["トップスが合わない"]||0)+1;continue;}o["トップス"]=pick(c);}
    const main=o["トップス"];
    if(needsInner(main)){
      let c=inners.filter(x=>x.id!==main.id);
      if(rule&&R.innerHemShow)c=c.filter(x=>lenIdx(x.length)>=lenIdx(main.length));
      c=fit(o,"インナー",c);if(!c.length){fails["合うインナーがない"]=(fails["合うインナーがない"]||0)+1;continue;}o["インナー"]=pick(c);}
    if(!o["ボトムス"]){const c=fit(o,"ボトムス",by("ボトムス"));if(!c.length)continue;o["ボトムス"]=pick(c);}
    if(sg.outer&&!o["アウター"]&&by("アウター").length){const c=fit(o,"アウター",by("アウター"));if(c.length)o["アウター"]=pick(c);}
    if(!o["靴"]&&by("靴").length){const c=fit(o,"靴",by("靴"));if(c.length)o["靴"]=pick(c);}
    if(sg.belt&&by("ベルト").length){const c=by("ベルト");const ref=o["靴"]&&o["靴"].colorMain;
      const modes=!rule?["どれでも"]:(R.beltMatchShoes?["合わせる"]:(Math.random()<.5?["合わせる","差し色"]:["差し色","合わせる"]));
      for(const m of modes){let cc=m==="どれでも"?c:c.filter(x=>m==="合わせる"?(ref&&x.colorMain===ref):!isBasic(x.colorMain));cc=fit(o,"ベルト",cc);
        if(!cc.length&&m==="合わせる")cc=fit(o,"ベルト",c.filter(x=>isBasic(x.colorMain)));
        if(cc.length){o["ベルト"]=pick(cc);beltMode=m;break;}}
      if(!o["ベルト"])notes.push("合うベルトがない");}
    if(sg.hat&&by("帽子").length){const c=fit(o,"帽子",by("帽子"));if(c.length)o["帽子"]=pick(c);else notes.push("合う帽子がない");}
    const bl=o["ボトムス"].length;
    if(sg.socks&&by("靴下").length){
      if(bl==="ショート"||bl==="アンクル"){
        let c=by("靴下");if(bl==="ショート"&&R.shortsShowSocks)c=c.filter(x=>x.sockLen==="クルー"||x.sockLen==="ハイ");
        const ref=[o["靴"]&&o["靴"].colorMain,o["ボトムス"].colorMain].filter(Boolean);
        const modes=Math.random()<.5?["合わせる","差し色"]:["差し色","合わせる"];
        for(const m of modes){let cc=c.filter(x=>m==="合わせる"?ref.includes(x.colorMain):!isBasic(x.colorMain));cc=fit(o,"靴下",cc);
          if(!cc.length&&m==="合わせる")cc=fit(o,"靴下",c.filter(x=>isBasic(x.colorMain)));
          if(cc.length){o["靴下"]=pick(cc);sockMode=m;break;}}
        if(!o["靴下"])notes.push(bl==="ショート"?"見せられる丈（クルー・ハイ）で合う靴下がない":"合う靴下がない");
      }else notes.push("フル丈なので靴下は見えない");}
    const cats=ORDER.filter(k=>o[k]);
    return {outfit:o,cats,notes,sockMode,beltMode};
  }
  const top=Object.entries(fails).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,2);
  return {err:"ルールに合う組み合わせが見つからなかった"+(top.length?`（主な理由：${top.join("、")}）`:"")+"。ルールを緩めるか、起点の服を変えてみる。"};
}

/* ===== 好みの学習 ===== */
function outfitFeatures(o){const f=[];const t=o["トップス"],b=o["ボトムス"];
  const ln=lineName(o);if(ln)f.push("line:"+ln);
  const ac=accentColors(Object.values(o));if(ac.length)ac.forEach(c=>f.push("accent:"+c));else f.push("accent:なし");
  if(t&&t.taste)f.push("taste:"+t.taste);
  if(t&&t.silhouette)f.push("topsil:"+t.silhouette);if(b&&b.silhouette)f.push("botsil:"+b.silhouette);
  if(b&&b.length)f.push("botlen:"+b.length);
  f.push("layer:"+(o["インナー"]?(t.sheer==="あり"?"透け×インナー":"重ね着"):"1枚"));
  return f;}
function prefScore(o){return outfitFeatures(o).reduce((a,k)=>a+(S.pref[k]||0),0);}
async function learn(o,d){outfitFeatures(o).forEach(k=>{S.pref[k]=Math.round(((S.pref[k]||0)+d)*10)/10;});await savePref();}
function generate(){const sg=S.sug;
  if(sg.mode!=="rule"||!Object.keys(S.pref).length)return generateCore(sg);
  let best=null,bs=-1e9;
  for(let i=0;i<8;i++){const r=generateCore(sg);if(!r.outfit){if(!best)best=r;continue;}const sc=prefScore(r.outfit)+Math.random()*1.2;if(sc>bs){bs=sc;best=r;}}
  return best;}
const PREF_GROUPS=[["line","よく選ぶライン"],["topsil","トップスのシルエット"],["botsil","ボトムスのシルエット"],["botlen","ボトムスの丈"],["accent","差し色"],["taste","テイスト"],["layer","重ね方"]];
function tendencyHTML(){const rows=[];
  for(const [g,lab] of PREF_GROUPS){const ent=Object.entries(S.pref).filter(([k,v])=>k.startsWith(g+":")&&v>0).sort((a,b)=>b[1]-a[1]);
    if(!ent.length)continue;const tot=ent.reduce((a,x)=>a+x[1],0);
    rows.push(`<div class="row" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">${lab}</span><span>${ent.slice(0,2).map(([k,v])=>`${esc(k.split(":")[1])}（${Math.round(v/tot*100)}%）`).join("、")}</span></div>`);}
  const neg=Object.entries(S.pref).filter(([k,v])=>v<0).sort((a,b)=>a[1]-b[1]).slice(0,3);
  if(neg.length)rows.push(`<div class="row" style="justify-content:space-between;padding:5px 0"><span class="muted">あまり選ばない</span><span>${neg.map(([k])=>esc(k.split(":")[1])).join("、")}</span></div>`);
  return rows.length?rows.join(""):`<div class="muted">提案に「いいね／いまいち」を付けたり「これを着た」を押したりすると、ここに好みの傾向が出る。</div>`;}

/* ===== 組み合わせの数え上げ ===== */
function enumCombos(extra){ // extra: 仮の服（買う前チェック用）
  const items=Object.values(S.items).filter(i=>i.cat&&!i.washing);if(extra)items.push(extra);
  const tops=items.filter(i=>i.cat==="トップス"&&!needsInner(i)),bots=items.filter(i=>i.cat==="ボトムス"),shoes=items.filter(i=>i.cat==="靴"),outs=items.filter(i=>i.cat==="アウター");
  const shoeList=shoes.length?shoes:[null];const count={};const add=id=>count[id]=(count[id]||0)+1;let total=0;const samples=[];
  for(const t of tops){if(checkPair({},t,"トップス"))continue;
    for(const b of bots){const o1={"トップス":t};if(checkPair(o1,b,"ボトムス"))continue;
      for(const sh of shoeList){const o2={"トップス":t,"ボトムス":b};if(sh&&checkPair(o2,sh,"靴"))continue;
        total++;add(t.id);add(b.id);if(sh)add(sh.id);const o3={...o2};if(sh)o3["靴"]=sh;
        if(extra&&(o3["トップス"]===extra||o3["ボトムス"]===extra||o3["靴"]===extra))samples.push(o3);
        for(const ou of outs){if(!checkPair(o3,ou,"アウター")){add(ou.id);if(extra&&ou===extra)samples.push({...o3,"アウター":ou});}}}}}
  return {count,total,samples};}
let COMBO_CACHE=null;
function comboStats(){if(COMBO_CACHE&&COMBO_CACHE.ver===S.ver&&COMBO_CACHE.rules===JSON.stringify(S.rules))return COMBO_CACHE.v;
  const v=enumCombos(null);COMBO_CACHE={ver:S.ver,rules:JSON.stringify(S.rules),v};return v;}
function sleepingItems(days){const now=Date.now();return Object.values(S.items).filter(i=>i.cat&&!["アクセサリー","バッグ"].includes(i.cat)&&
  (i.lastWorn?daysSince(i.lastWorn)>=days:(now-(i.created||now))/86400000>=Math.min(days,30)));}

/* ===== 旅行のパッキング ===== */
function packTrip(days){const sg={...S.sug,mode:"rule",anchor:""};const packed=new Set();const plan=[];const usedTops=new Set();
  for(let d=0;d<days;d++){let best=null,bs=1e9;
    for(let t=0;t<120;t++){const r=generateCore(sg,{noRecent:true,noAnchor:true});if(!r.outfit)continue;
      const ids=Object.values(r.outfit).map(i=>i.id);let sc=ids.filter(id=>!packed.has(id)).length;
      if(usedTops.has(r.outfit["トップス"].id))sc+=0.8;if(sc<bs){bs=sc;best=r;}}
    if(!best)return {err:"組み合わせが作れなかった。季節やルールを見直す"};
    Object.values(best.outfit).forEach(i=>packed.add(i.id));usedTops.add(best.outfit["トップス"].id);plan.push(best.outfit);}
  return {plan,items:[...packed].map(id=>S.items[id])};}

/* ===== 着画イメージ ===== */
function piece(it,x,y,w,h,clip,z,extra){
  const src=imgSrc(it);const bg=it.colorMain?colorCss(it.colorMain):"#bbb";

  return `<div class="pc ${src?"":"noimg"}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;clip-path:${clip};z-index:${z};background:${bg};${extra||""}">${inner}</div>`;
}
function figureHTML(o){
  const cx=120,top=o["トップス"],inn=o["インナー"],bot=o["ボトムス"],out=o["アウター"],sh=o["靴"],belt=o["ベルト"],hat=o["帽子"],sock=o["靴下"];
  const waist=200,feet=440;
  let h="";
  const skin="#e2ddd5";
  h+=`<svg viewBox="0 0 240 480" width="240" height="480"><g fill="${skin}">
    <circle cx="120" cy="42" r="24"/><rect x="111" y="62" width="18" height="20" rx="6"/>
    <rect x="44" y="92" width="18" height="190" rx="9"/><rect x="178" y="92" width="18" height="190" rx="9"/>
    <rect x="88" y="200" width="28" height="245" rx="12"/><rect x="124" y="200" width="28" height="245" rx="12"/></g></svg>`;
  const TOPCLIP="polygon(18% 0,82% 0,100% 10%,100% 55%,94% 58%,94% 100%,6% 100%,6% 58%,0 55%,0 10%)";

  const tl=t=>({"短め":112,"普通":138,"長め":168}[t.length]||138);
  let bw=92;
  if(bot){const wmap={"タイト":78,"レギュラー":92,"ゆったり":108,"ワイド":126};bw=wmap[bot.silhouette]||92;

  const most=[...all].sort((a,b)=>(b.wear||0)-(a.wear||0)).filter(i=>i.wear).slice(0,5);
  $("#v-log").innerHTML=`
    <div class="stat"><div><b>${total}</b><span>登録した服</span></div><div><b>${never}</b><span>未着用</span></div><div><b>${mCount}</b><span>今月の記録</span></div></div>
    <div class="card" style="margin-top:12px"><h3>あなたの傾向</h3>${tendencyHTML()}</div>
    ${rankHTML()}
    ${(()=>{const g=sleepingItems(365);return g.length?`<div class="card"><h3>手放し候補（1年以上着ていない）</h3><div class="outfit">${g.map(i=>`<div class="oItem" data-id="${i.id}" style="cursor:pointer"><div class="ph">${ph(i)}</div><div class="nm">${esc(i.name||i.cat)}</div></div>`).join("")}</div></div>`:"";})()}
    <div class="card"><h3>眠っている服</h3>
      ${sleeping.length?`<div class="outfit">${sleeping.map(i=>`<div class="oItem" data-id="${i.id}" style="cursor:pointer"><div class="ph">${ph(i)}</div>
      <div class="lb">${i.lastWorn?(daysSince(i.lastWorn)?daysSince(i.lastWorn)+"日前":"今日"):"未着用"}</div><div class="nm">${esc(i.name||i.cat)}</div></div>`).join("")}</div>`:`<div class="muted">まだ服がない</div>`}</div>
    <div class="card"><h3>よく着る服</h3>${most.length?most.map(i=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${esc(i.name||i.cat)}</span><span class="muted">${i.wear}回</span></div>`).join(""):`<div class="muted">まだ記録がない</div>`}</div>
    ${(()=>{const ph2=S.log.filter(l=>l.photoKey&&PHOTO_URL[l.photoKey]).slice(0,30);return ph2.length?`<div class="card"><h3>コーデ日記</h3><div class="outfit">${ph2.map(l=>`<div class="oItem"><div class="ph" style="aspect-ratio:3/4"><img src="${esc(PHOTO_URL[l.photoKey])}"></div><div class="lb">${esc(l.date)}</div></div>`).join("")}</div></div>`:"";})()}
    <div class="card"><h3>着用の履歴</h3>${S.log.length?S.log.slice(0,60).map(l=>`<div class="logE"><span class="d">${esc(l.date)}</span>${l.photoKey&&PHOTO_URL[l.photoKey]?`<div class="th" style="border:2px solid var(--acc)"><img src="${esc(PHOTO_URL[l.photoKey])}"></div>`:""}
      ${l.ids.map(id=>S.items[id]).filter(Boolean).map(i=>`<div class="th">${imgSrc(i)?`<img src="${esc(imgSrc(i))}">`:""}</div>`).join("")}</div>`).join(""):`<div class="muted">「これを着た」を押すとここに残る</div>`}</div>`;
  $("#v-log").querySelectorAll("[data-id]").forEach(e=>e.onclick=()=>openDetail(e.dataset.id));
}

/* ===== ルール ===== */
function renderRules(){
  const R=S.rules;
  const tg=(k,t,s)=>`<div class="sw-toggle"><div>${t}<small>${s}</small></div><input type="checkbox" data-k="${k}" ${R[k]?"checked":""}></div>`;
  $("#v-rules").innerHTML=`
    <div class="card"><h3>ベーシック色</h3><p class="muted" style="margin:0 0 8px">ここで選んだ色は何とでも合う扱いにする。それ以外は差し色として数える。</p>
      ${chipGroup("colorBasic",COLORS.map(c=>c[0]),R.basic,true)}
      <label class="f">1コーデの差し色の上限</label>${chipGroup("maxAccent",["0","1","2","3"],String(R.maxAccent))}</div>
    <div class="card"><h3>組み合わせのルール（ルールモードのみ）</h3>
      ${tg("noBothLoose","上下とも太い組み合わせを避ける","ゆったり・ワイド同士を組ませない")}
      ${tg("outerLonger","アウターの着丈はトップス以上","アウターからトップスがはみ出さない")}
      ${tg("tasteMatch","テイストをそろえる","「どれでも」の服はどれとも合う扱い")}
      ${tg("preferLowWear","着用回数が少ない服を優先する","最近着ていない服ほど出やすくする")}
      ${tg("beltMatchShoes","ベルトは必ず靴と色をそろえる","オフのときは、靴と同色か差し色のどちらかを毎回選ぶ")}
      ${tg("shortsShowSocks","ショート丈のときは靴下を見せる","クルー丈・ハイ丈の靴下だけを選ぶ")}
      ${tg("innerHemShow","レイヤードでインナーの裾を見せる","インナーの着丈を、上に重ねる服以上にする")}
      <label class="f">同じ服を続けて出さない日数</label>${chipGroup("avoidDays",["0","1","2","3","5","7"],String(S.rules.avoidDays??3))}
      <label class="f">眠っている服とみなす日数</label>${chipGroup("sleepDays",["30","60","90","180"],String(S.rules.sleepDays||90))}</div>
    <div class="card"><h3>使い方</h3><div class="row"><button class="btn sec" id="obAgain" style="flex:1">使い方をもう一度見る</button>
      ${Object.values(S.items).some(i=>i.sample)?`<button class="btn sec" data-clearsample style="flex:1">お試しデータを消す</button>`:`<button class="btn sec" data-loadsample style="flex:1">お試しデータを入れる</button>`}</div></div>
    <div class="card"><h3>好みの学習</h3><p class="muted" style="margin:0 0 8px">「いいね／いまいち」「これを着た」から、好きな組み合わせを覚えて提案に反映している。</p><button class="btn sec" id="resetPref">学習をリセット</button></div>
    <div class="card"><h3>シルエットの名前の付け方</h3><div class="muted">Aライン：トップス短め × ワイド・ゆったりのボトムス<br>Yライン：ゆったりのトップス × タイト・レギュラーのボトムス<br>Iライン：上下ともタイト・レギュラー</div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn sec" id="resetR">初期設定に戻す</button></div>
    <div class="card" style="margin-top:12px"><h3>バックアップ</h3><p class="muted" style="margin:0 0 10px">データはこの端末の中だけにある。機種変更の前や、ときどき書き出してファイルアプリやiCloudに保存しておく。</p>
      <div class="row"><button class="btn sec" id="expB" style="flex:1">書き出す</button><button class="btn sec" id="impB" style="flex:1">読み込む</button></div></div>`;
  const v=$("#v-rules");
  bindChips(v,g=>{if(g==="avoidDays")R.avoidDays=Number(readGroup(v,"avoidDays"));if(g==="sleepDays")R.sleepDays=Number(readGroup(v,"sleepDays"));if(g==="colorBasic")R.basic=readGroup(v,"colorBasic");if(g==="maxAccent")R.maxAccent=Number(readGroup(v,"maxAccent")||1);saveRules();});
  v.querySelectorAll("input[data-k]").forEach(c=>c.onchange=()=>{R[c.dataset.k]=c.checked;saveRules();});
  $("#obAgain").onclick=showOnboarding;
  $("#resetPref").onclick=async()=>{S.pref={};await savePref();toast("学習をリセットした");render();};
  $("#expB").onclick=exportData;$("#impB").onclick=importData;
  $("#resetR").onclick=()=>{S.rules={...DEFAULT_RULES,basic:[...DEFAULT_RULES.basic]};saveRules();toast("初期設定に戻した");};
}

init();
</script>
</body>
</html>
